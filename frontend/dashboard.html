<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Главная</title>
    <style id="sidebar-init-style">.main-content{opacity:0!important;transition:none!important}.sidebar{transition:none!important}</style>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .page { padding: 24px 32px; max-width: 1400px; }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        /* Cards row */
        .cards-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 24px;
        }
        .cards-row::-webkit-scrollbar { height: 4px; }
        .cards-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .dash-card {
            flex-shrink: 0;
            width: 190px;
            min-width: 190px;
            max-width: 190px;
            height: 120px;
            background: var(--bg-card-light);
            border-radius: 16px;
            padding: 16px 20px;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .dash-card:hover { border-color: var(--primary); }

        .dash-card-dark {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            border: 2px solid transparent;
        }
        .dash-card-dark:hover { border-color: var(--primary); }
        .dash-card-dark .card-name,
        .dash-card-dark .card-balance { color: #fff; }
        .dash-card-dark .card-sub { color: rgba(255,255,255,0.6); }

        .card-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .card-balance {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .card-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--primary-light);
            color: var(--primary);
            margin-bottom: 2px;
            white-space: nowrap;
        }

        /* Add card */
        .dash-card-add {
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: var(--text-secondary);
            width: 90px !important;
            min-width: 90px !important;
            max-width: 90px !important;
        }
        .dash-card-add:hover { border-color: var(--primary); color: var(--primary); }
        .dash-card-add .add-icon {
            width: 30px; height: 30px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .dash-card-add .add-icon svg { width: 16px; height: 16px; color: var(--primary); }
        .dash-card-add span { font-size: 11px; }

        /* Table */
        .table-wrap {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }
        .recent-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .recent-table thead th {
            padding: 10px 12px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        .recent-table tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .recent-table tbody tr:last-child { border-bottom: none; }
        .recent-table tbody tr:hover { background: var(--primary-light); }
        .recent-table tbody td {
            padding: 8px 12px;
            color: var(--text-primary);
            vertical-align: middle;
            font-size: 13px;
        }
        .td-date { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
        .td-desc { font-weight: 500; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .td-account { color: var(--text-secondary); font-size: 13px; }
        .td-amount { font-weight: 700; text-align: right; white-space: nowrap; }
        .amount-income { color: var(--success); }
        .amount-expense { color: var(--danger); }
        .td-comment { color: var(--text-secondary); font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .empty-hint { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }

        /* Skeleton */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        @media (max-width: 768px) {
            .main-content { margin-left: 0; margin-bottom: 70px; }
            .page { padding: 16px; }
        }
    </style>
</head>
<body>

<main class="main-content">
    <div class="page">
        <!-- Accounts Section -->
        <div class="section-title">Мои счета</div>
        <div id="accounts-container" class="cards-row">
            <div class="dash-card" style="height:120px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:16px"></div>
        </div>

        <!-- Funds Section -->
        <div class="section-title" data-fund-feature>Фонды</div>
        <div id="funds-container" class="cards-row" data-fund-feature>
            <div class="dash-card" style="height:120px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:16px"></div>
        </div>

        <!-- Recent Transactions -->
        <div class="section-title">Последние операции</div>
        <div id="transactions-container">
            <div class="table-wrap"><div class="empty-hint">Загрузка...</div></div>
        </div>
    </div>
</main>

<script src="js/custom-select.js"></script>
<script src="js/layout.js"></script>
<script>
const API = 'http://127.0.0.1:8000';

const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) {
    window.location.href = 'index.html';
}

function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}

async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

function fmt(amount) {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency',
        currency: 'RUB',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
    }).format(amount);
}

function fmtDateRu(iso) {
    return new Date(iso).toLocaleDateString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
    });
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

const FUND_TYPE_LABELS = {
    budget: 'Бюджет',
    investment: 'Инвестиции',
    tax_reserve: 'Налоговый резерв',
    debt: 'Долг',
    loan: 'Займ',
    placement: 'Размещение',
};

// ── Accounts ──
async function loadAccounts() {
    try {
        const accounts = await apiFetch('/accounts');
        const container = document.getElementById('accounts-container');

        if (!accounts.length) {
            container.innerHTML = '<div class="dash-card dash-card-add" onclick="location.href=\'accounts.html\'"><div class="add-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div><span>Добавить</span></div>';
            return;
        }

        const total = accounts.reduce((s, a) => s + a.balance, 0);
        let html = '';

        // Total card
        html += '<div class="dash-card dash-card-dark" onclick="location.href=\'accounts.html\'">';
        html += '<div><div class="card-sub">Всего</div><div class="card-name">Все счета</div></div>';
        html += '<div class="card-balance">' + fmt(total) + '</div>';
        html += '</div>';

        // Individual cards
        accounts.forEach(function(acc) {
            html += '<div class="dash-card" onclick="location.href=\'accounts.html\'">';
            html += '<div><div class="card-name">' + escHtml(acc.name) + '</div></div>';
            html += '<div class="card-balance">' + fmt(acc.balance) + '</div>';
            html += '</div>';
        });

        // Add card
        html += '<div class="dash-card dash-card-add" onclick="location.href=\'accounts.html\'">';
        html += '<div class="add-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>';
        html += '<span>Добавить</span></div>';

        container.innerHTML = html;
    } catch (err) {
        console.error('Error loading accounts:', err);
        document.getElementById('accounts-container').innerHTML = '<div class="empty-hint" style="color:var(--danger)">Ошибка загрузки счетов</div>';
    }
}

// ── Funds ──
async function loadFunds() {
    try {
        const funds = await apiFetch('/funds');
        const container = document.getElementById('funds-container');

        if (!funds.length) {
            container.innerHTML = '<div class="dash-card dash-card-add" onclick="location.href=\'funds.html\'"><div class="add-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div><span>Добавить</span></div>';
            return;
        }

        const total = funds.reduce((s, f) => s + (f.balance || 0), 0);
        let html = '';

        // Total card
        html += '<div class="dash-card dash-card-dark" onclick="location.href=\'funds.html\'">';
        html += '<div><div class="card-sub">Всего</div><div class="card-name">Все фонды</div></div>';
        html += '<div class="card-balance">' + fmt(total) + '</div>';
        html += '</div>';

        // Individual fund cards
        funds.forEach(function(fund) {
            html += '<div class="dash-card" onclick="location.href=\'funds.html\'">';
            html += '<div>';
            html += '<div class="card-badge">' + escHtml(FUND_TYPE_LABELS[fund.type] || fund.type) + '</div>';
            html += '<div class="card-name">' + escHtml(fund.name) + '</div>';
            html += '</div>';
            html += '<div class="card-balance">' + fmt(fund.balance || 0) + '</div>';
            html += '</div>';
        });

        // Add card
        html += '<div class="dash-card dash-card-add" onclick="location.href=\'funds.html\'">';
        html += '<div class="add-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>';
        html += '<span>Добавить</span></div>';

        container.innerHTML = html;
    } catch (err) {
        console.error('Error loading funds:', err);
        document.getElementById('funds-container').innerHTML = '<div class="empty-hint" style="color:var(--danger)">Ошибка загрузки фондов</div>';
    }
}

// ── Transactions ──
async function loadTransactions() {
    try {
        const txns = await apiFetch('/transactions');
        const container = document.getElementById('transactions-container');

        // Take last 10 transactions (sorted by date desc, API returns newest first)
        const recent = txns.slice(0, 10);

        if (!recent.length) {
            container.innerHTML = '<div class="table-wrap"><div class="empty-hint">Нет операций</div></div>';
            return;
        }

        // Load accounts and categories for display names
        var accounts = [];
        var categories = [];
        try {
            accounts = await apiFetch('/accounts');
            categories = await apiFetch('/categories');
        } catch(e) {}

        var accountMap = {};
        accounts.forEach(function(a) { accountMap[a.id] = a.name; });
        var categoryMap = {};
        categories.forEach(function(c) { categoryMap[c.id] = c.name; });

        let html = '<div class="table-wrap"><table class="recent-table"><thead><tr>';
        html += '<th>Дата</th><th>Описание</th><th>Счёт</th><th style="text-align:right">Сумма</th><th>Комментарий</th>';
        html += '</tr></thead><tbody>';

        recent.forEach(function(tx) {
            var dateStr = fmtDateRu(tx.date);
            var desc = categoryMap[tx.category_id] || '—';
            var accName = accountMap[tx.account_id] || '—';
            var amountClass = tx.type === 'income' ? 'amount-income' : 'amount-expense';
            var amountPrefix = tx.type === 'income' ? '+' : '-';
            var comment = tx.comment || '';

            html += '<tr>';
            html += '<td class="td-date">' + escHtml(dateStr) + '</td>';
            html += '<td class="td-desc">' + escHtml(desc) + '</td>';
            html += '<td class="td-account">' + escHtml(accName) + '</td>';
            html += '<td class="td-amount ' + amountClass + '">' + amountPrefix + fmt(tx.amount) + '</td>';
            html += '<td class="td-comment">' + escHtml(comment) + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
    } catch (err) {
        console.error('Error loading transactions:', err);
        document.getElementById('transactions-container').innerHTML = '<div class="table-wrap"><div class="empty-hint" style="color:var(--danger)">Ошибка загрузки операций</div></div>';
    }
}

// ── Init ──
loadAccounts();
loadFunds();
loadTransactions();
</script>
</body>
</html>
