<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Главная</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Colors from mockup */
            --primary: #1a6dff;
            --primary-dark: #1558d6;
            --primary-light: #eff4ff;
            --bg-body: #f5f7fb;
            --bg-card-dark: #1e293b;
            --bg-card-light: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            
            /* Layout */
            --sidebar-w: 80px;
            --sidebar-w-expanded: 260px;
            --header-h: 64px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px;
            z-index: 100;
            transition: width 0.3s ease;
        }

        .sidebar.expanded {
            width: var(--sidebar-w-expanded);
            padding: 16px 20px;
            align-items: flex-start;
        }

        .sidebar-toggle {
            width: 100%;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            margin-top: 8px;
            margin-bottom: 16px;
            padding: 0;
        }

        .sidebar-toggle:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .sidebar-toggle svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }

        .sidebar:not(.expanded) .sidebar-toggle svg {
            transform: rotate(180deg);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            width: 100%;
            flex-shrink: 0;
        }
        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sidebar-logo-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .sidebar-logo-text {
            display: none;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .sidebar.expanded .sidebar-logo-text { display: block; }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .nav-item {
            width: 100%;
            height: 48px;
            border: none;
            background: transparent;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            position: relative;
            gap: 12px;
            padding: 0 12px;
        }

        .sidebar:not(.expanded) .nav-item {
            justify-content: center;
        }

        .sidebar.expanded .nav-item {
            justify-content: flex-start;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: #fff;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .nav-item-text {
            display: none;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }

        .sidebar.expanded .nav-item-text {
            display: block;
        }

        .nav-item .nav-tooltip {
            position: absolute;
            left: calc(100% + 12px);
            background: var(--text-primary);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .sidebar.expanded .nav-item .nav-tooltip {
            display: none;
        }

        .sidebar:not(.expanded) .nav-item:hover .nav-tooltip {
            opacity: 1;
        }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-width: 0;
            transition: margin-left 0.3s ease;
        }

        body.sidebar-expanded .main-content {
            margin-left: var(--sidebar-w-expanded);
        }

        /* ========== HEADER ========== */
        .header {
            height: var(--header-h);
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav-item {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .header-nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .header-nav-item.active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .header-icon-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .header-icon-btn svg {
            width: 20px;
            height: 20px;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--bg-body);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-menu:hover {
            background: var(--primary-light);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* ========== PAGE CONTENT ========== */
        .page {
            padding: 32px;
            max-width: 1400px;
        }

        /* Accounts Section */
        .accounts-section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title .refresh-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .section-title .refresh-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .section-title .refresh-btn svg {
            width: 16px;
            height: 16px;
        }

        .accounts-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .accounts-row::-webkit-scrollbar {
            height: 6px;
        }

        .accounts-row::-webkit-scrollbar-track {
            background: var(--bg-body);
            border-radius: 3px;
        }

        .accounts-row::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .account-card {
            flex-shrink: 0;
            min-width: 240px;
            max-width: 280px;
            background: var(--bg-card-light);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .account-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        }

        .account-card.selected {
            border-color: var(--primary);
        }

        .account-card-dark {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
        }

        .account-card-dark .account-name {
            color: var(--text-muted);
        }

        .account-card-dark .account-change {
            color: var(--success);
        }

        .account-card-dark .account-balance {
            color: #fff;
        }

        .account-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .account-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .account-change {
            font-size: 12px;
            font-weight: 600;
            color: var(--success);
            margin-bottom: 8px;
        }

        .account-balance {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .account-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .account-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .account-card-dark .account-action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .account-action-btn:hover {
            background: var(--primary);
            color: #fff;
        }

        .account-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .account-card-add {
            background: var(--bg-card-light);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-secondary);
        }

        .account-card-add:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .account-card-add .add-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .account-card-add .add-icon svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }

        .account-card-add span {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        /* Add Payment Section */
        .add-payment-section {
            margin-bottom: 32px;
        }

        .add-payment-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .add-payment-form {
            background: var(--bg-card-light);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fafafa;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group .input-icon {
            position: relative;
        }

        .form-group .input-icon svg {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .form-row-full {
            display: flex;
            gap: 16px;
        }

        .form-row-full .form-group {
            flex: 1;
        }

        .btn-primary {
            padding: 14px 32px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            align-self: flex-start;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 109, 255, 0.3);
        }

        /* Info Card */
        .info-card {
            background: var(--bg-card-light);
            border-radius: 20px;
            padding: 24px;
            margin-top: 16px;
            border: 1px solid var(--border);
        }

        .info-card-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .info-card-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-card-icon svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        .info-card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .info-card-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Transactions Table */
        .transactions-section {
            margin-top: 32px;
        }

        .table-container {
            background: var(--bg-card-light);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .table-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table-actions {
            display: flex;
            gap: 12px;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: #fff;
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-secondary svg {
            width: 16px;
            height: 16px;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: var(--bg-body);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        .date-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
        }

        .date-filter input {
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
        }

        .search-filter {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-filter input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fff;
            outline: none;
            transition: all 0.2s;
        }

        .search-filter input:focus {
            border-color: var(--primary);
        }

        .search-filter svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--primary-light);
        }

        tbody td {
            padding: 16px 20px;
            color: var(--text-primary);
        }

        .td-num {
            color: var(--text-muted);
            font-size: 13px;
            width: 40px;
        }

        .td-date {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .td-desc {
            font-weight: 500;
        }

        .td-category {
            color: var(--text-secondary);
        }

        .td-category span {
            padding: 4px 12px;
            background: var(--bg-body);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .td-type span {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-income {
            background: #f0fdf4;
            color: var(--success);
        }

        .type-expense {
            background: #fef2f2;
            color: var(--danger);
        }

        .td-amount {
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }

        .amount-income {
            color: var(--success);
        }

        .amount-expense {
            color: var(--danger);
        }

        .td-actions {
            text-align: right;
            white-space: nowrap;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-body);
            color: var(--primary);
        }

        .action-btn.delete:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        .table-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: #fafafa;
        }

        .table-total {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination button {
            width: 36px;
            height: 36px;
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover,
        .pagination button.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* Skeleton loading */
        .skeleton {

<script>
const API = 'http://127.0.0.1:8000';

// Auth guard
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// Decode JWT
function parseJwt(t) {
    try {
        const payload = t.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
    } catch { return {}; }
}

const jwt = parseJwt(token);
const displayName = jwt.name || jwt.email || 'Пользователь';
document.getElementById('user-name').textContent = displayName;
document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

// Logout
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}
document.getElementById('logout-btn').addEventListener('click', logout);

// API fetch
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// Formatters
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function fmtDate(iso) {
    return new Date(iso).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
    });
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Load accounts
async function loadAccounts() {
    const container = document.getElementById('accounts-container');
    try {
        const [accounts, funds] = await Promise.all([
            apiFetch('/accounts'),
            apiFetch('/funds')
        ]);
        container.innerHTML = '';

        // Combined balance
        const totalBalance = (accounts.reduce((s, a) => s + a.balance, 0) + 
                             funds.reduce((s, f) => s + (f.balance || 0), 0));

        // "All accounts" card (dark)
        const allCard = document.createElement('div');
        allCard.className = 'account-card account-card-dark selected';
        allCard.innerHTML = `
            <div class="account-header">
                <div>
                    <div class="account-name">Все счета</div>
                    <div class="account-balance">${fmt(totalBalance)}</div>
                </div>
            </div>
        `;
        container.appendChild(allCard);

        // Individual accounts
        accounts.forEach(acc => {
            const card = document.createElement('div');
            card.className = 'account-card';
            card.innerHTML = `
                <div class="account-header">
                    <div>
                        <div class="account-name">${escHtml(acc.name)}</div>
                        <div class="account-balance">${fmt(acc.balance)}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // Add fund cards
        funds.forEach(fund => {
            const card = document.createElement('div');
            card.className = 'account-card';
            card.innerHTML = `
                <div class="account-header">
                    <div>
                        <div class="account-name">${escHtml(fund.name)} (Фонд)</div>
                        <div class="account-balance">${fmt(fund.balance || 0)}</div>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        // Add account card
        const addCard = document.createElement('div');
        addCard.className = 'account-card account-card-add';
        addCard.innerHTML = `
            <div class="add-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </div>
            <span>Добавить счёт</span>
        `;
        addCard.addEventListener('click', () => {
            window.location.href = 'accounts.html';
        });
        container.appendChild(addCard);

    } catch (err) {
        console.error('Error loading accounts:', err);
        container.innerHTML = '<p style="color: var(--danger); padding: 20px;">Ошибка загрузки счетов</p>';
    }
}

// Load transactions
async function loadTransactions() {
    const tbody = document.getElementById('transactions-tbody');
    try {
        const all = await apiFetch('/transactions');
        const txs = all.slice(0, 10);
        tbody.innerHTML = '';

        if (!txs.length) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-secondary);">Операций пока нет</td></tr>`;
            return;
        }

        let total = 0;
        txs.forEach((tx, i) => {
            const isIncome = tx.type === 'income';
            total += isIncome ? tx.amount : -tx.amount;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="td-num">#${String(i + 1).padStart(5, '0')}</td>
                <td class="td-date">${fmtDate(tx.created_at)}</td>
                <td class="td-desc">${escHtml(tx.comment || 'Без описания')}</td>
                <td class="td-category"><span>Категория</span></td>
                <td><span class="${isIncome ? 'type-income' : 'type-expense'}">${isIncome ? 'Доход' : 'Расход'}</span></td>
                <td class="td-amount ${isIncome ? 'amount-income' : 'amount-expense'}">${isIncome ? '+' : '-'}${fmt(tx.amount)}</td>
                <td class="td-actions">
                    <div class="action-btns">
                        <button class="action-btn" aria-label="Редактировать">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="action-btn delete" aria-label="Удалить">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('table-total').textContent = `Итого: ${fmt(total)}`;

    } catch (err) {
        console.error('Error loading transactions:', err);
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--danger);">Ошибка загрузки операций</td></tr>`;
    }
}

// Init
document.addEventListener('DOMContentLoaded', () => {
    // Set today's date
    document.getElementById('tx-date').valueAsDate = new Date();
    loadAccounts();
    loadTransactions();
    
    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const SIDEBAR_STATE_KEY = 'sidebar_expanded';
    
    // Restore sidebar state from localStorage
    const isExpanded = localStorage.getItem(SIDEBAR_STATE_KEY) === 'true';
    if (isExpanded) {
        sidebar.classList.add('expanded');
        document.body.classList.add('sidebar-expanded');
    }
    
    // Toggle sidebar
    sidebarToggle.addEventListener('click', () => {
        sidebar.classList.toggle('expanded');
        document.body.classList.toggle('sidebar-expanded');
        localStorage.setItem(SIDEBAR_STATE_KEY, sidebar.classList.contains('expanded'));
    });
});
</script>
</body>
</html>
