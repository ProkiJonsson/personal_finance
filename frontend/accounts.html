<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Счета</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:       #1a6dff;
            --blue-dark:  #1558d6;
            --blue-light: #eff4ff;
            --sidebar-w:  240px;
            --header-h:   64px;
            --text:       #111827;
            --text-muted: #6b7280;
            --border:     #e5e7eb;
            --bg:         #f5f7fb;
            --white:      #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
        }

        .sidebar-logo {
            height: var(--header-h);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-logo-icon {
            width: 34px; height: 34px;
            background: var(--blue);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-logo-icon svg { width: 18px; height: 18px; fill: #fff; }

        .sidebar-logo span {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 10px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--blue-light); color: var(--blue); }

        .nav-item.active {
            background: var(--blue-light);
            color: var(--blue);
            font-weight: 600;
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

        .nav-section {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.07em;
            color: #9ca3af;
            text-transform: uppercase;
            padding: 16px 12px 6px;
        }

        .sidebar-bottom {
            padding: 10px;
            border-top: 1px solid var(--border);
        }

        /* ── Header ──────────────────────────────────── */
        .header {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--header-h);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 14px;
            z-index: 40;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .header-spacer { flex: 1; }

        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 34px; height: 34px;
            background: var(--blue-light);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--blue);
            flex-shrink: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        .user-name:hover { color: var(--blue); }

        .btn-logout {
            padding: 7px 16px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        /* ── Main content ─────────────────────────────── */
        .content {
            margin-left: var(--sidebar-w);
            padding-top: var(--header-h);
            min-height: 100vh;
        }

        .page {
            padding: 28px 28px 40px;
            max-width: 1100px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        /* ── Buttons ──────────────────────────────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-primary:hover { background: var(--blue-dark); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary svg { width: 16px; height: 16px; fill: #fff; }

        .btn-secondary {
            padding: 9px 18px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
            font-family: inherit;
        }

        .btn-secondary:hover { border-color: #9ca3af; color: var(--text); }

        .btn-danger {
            padding: 9px 18px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-danger:hover { background: #b91c1c; }

        .btn-icon {
            width: 32px; height: 32px;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            background: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }

        .btn-icon svg { width: 15px; height: 15px; fill: currentColor; }

        .btn-icon-edit { color: var(--text-muted); }
        .btn-icon-edit:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

        .btn-icon-del { color: var(--text-muted); }
        .btn-icon-del:hover { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }

        .btn-icon-copy { color: var(--text-muted); }
        .btn-icon-copy:hover { background: #f0fdf4; border-color: #86efac; color: #16a34a; }

        /* ── Table ────────────────────────────────────── */
        .table-wrap {
            background: var(--white);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            background: #f9fafb;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #fafbff; }

        tbody td {
            padding: 13px 16px;
            color: var(--text);
            vertical-align: middle;
        }

        .td-name { font-weight: 600; }

        .td-balance {
            font-weight: 700;
            white-space: nowrap;
        }

        .td-date {
            color: var(--text-muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .td-actions {
            white-space: nowrap;
        }

        .td-actions-inner {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* ── States ───────────────────────────────────── */
        .state-empty, .state-error {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .state-error { color: #dc2626; }

        /* ── Skeleton ─────────────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 4px;
            display: inline-block;
        }

        @keyframes shimmer { to { background-position: -200% 0; } }

        .sk-row td { padding: 14px 16px; }
        .sk { display: block; height: 14px; border-radius: 4px; }

        /* ── Modal overlay ────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            transform: translateY(12px);
            transition: transform 0.2s;
        }

        .modal-overlay.open .modal { transform: translateY(0); }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            width: 30px; height: 30px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            transition: background 0.15s;
        }

        .modal-close:hover { background: #f3f4f6; }
        .modal-close svg { width: 16px; height: 16px; fill: currentColor; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            padding: 10px 13px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 14px;
            color: var(--text);
            background: var(--white);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus { border-color: var(--blue); }

        .form-group input.invalid,
        .form-group select.invalid { border-color: #dc2626; }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-error {
            font-size: 12px;
            color: #dc2626;
            min-height: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        /* ── Confirm dialog ───────────────────────────── */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .confirm-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .confirm-box {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            transform: translateY(12px);
            transition: transform 0.2s;
        }

        .confirm-overlay.open .confirm-box { transform: translateY(0); }

        .confirm-box h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .confirm-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ── IB modal ─────────────────────────────────── */
        .modal-wide { max-width: 720px; }
        .ib-table-wrap { overflow-x: auto; margin-top: 4px; }
        .ib-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ib-table th { background: #f9fafb; padding: 8px 12px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
        .ib-table td { padding: 7px 8px; border-bottom: 1px solid var(--border); }
        .ib-table tr:last-child td { border-bottom: none; }
        .ib-table input[type="number"] { width: 120px; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; color: var(--text); background: var(--white); font-family: inherit; }
        .ib-table input[type="number"]:focus { outline: none; border-color: var(--blue); }
    </style>
</head>
<body>

                <button class="btn-secondary" id="btn-initial-balances">Начальные остатки</button>
                <button class="btn-primary" id="add-account-btn">

                    Добавить счёт

                <thead>

<!-- ── Account modal ──────────────────────────────────── -->
<div class="modal-overlay" id="account-modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
            <span class="modal-title" id="modal-title">Добавить счёт</span>
            <button class="modal-close" id="modal-close-btn" aria-label="Закрыть">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <form id="account-form" novalidate>
            <div class="form-group">
                <label for="field-name">Название</label>
                <input type="text" id="field-name" placeholder="Например: Основная карта" maxlength="100" autocomplete="off">
                <span class="form-error" id="err-name"></span>
            </div>
            <span class="form-error" id="err-global"></span>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="modal-cancel-btn">Отмена</button>
                <button type="submit" class="btn-primary" id="modal-submit-btn">Добавить</button>
            </div>
        </form>
    </div>
</div>

<!-- ── Confirm dialog ─────────────────────────────────── -->
<div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-box" role="dialog" aria-modal="true">
        <h3>Удалить счёт?</h3>
        <p id="confirm-text">Это действие нельзя отменить.</p>
        <div class="confirm-footer">
            <button class="btn-secondary" id="confirm-cancel-btn">Отмена</button>
            <button class="btn-danger" id="confirm-ok-btn">Удалить</button>
        </div>
    </div>
</div>

<!-- ── Initial balances modal ──────────────────────────── -->
<div class="modal-overlay" id="ib-modal-overlay">
    <div class="modal modal-wide" role="dialog" aria-modal="true">
        <div class="modal-header">
            <span class="modal-title">Начальные остатки</span>
            <button class="modal-close" id="ib-modal-close">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
        <div class="form-group">
            <label for="ib-date">Дата остатков</label>
            <input type="date" id="ib-date" style="max-width:180px">
        </div>
        <div class="ib-table-wrap">
            <table class="ib-table">
                <thead id="ib-thead"></thead>
                <tbody id="ib-tbody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="ib-modal-cancel">Отмена</button>
            <button class="btn-primary" id="ib-modal-save">Сохранить</button>
        </div>
    </div>
</div>

<script>
const API = 'http://127.0.0.1:8000';

// ── Auth guard ──────────────────────────────────────
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// ── Decode JWT ──────────────────────────────────────
function parseJwt(t) {
    try {
        const payload = t.split('.')[1];
        return JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
    } catch { return {}; }
}

const jwt = parseJwt(token);
const displayName = jwt.name || jwt.email || 'Пользователь';
document.getElementById('user-name').textContent = displayName;
document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

// ── Logout ──────────────────────────────────────────
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('header-logout-btn').addEventListener('click', logout);

// ── API helper ──────────────────────────────────────
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// ── Formatters ──────────────────────────────────────
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleDateString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
    });
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ── State ───────────────────────────────────────────
let editingId = null;

// ── Render table ────────────────────────────────────
function renderAccounts(accounts) {
    const tbody = document.getElementById('accounts-tbody');
    tbody.innerHTML = '';

    if (!accounts.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="state-empty">Счетов пока нет. Добавьте первый счёт.</td></tr>`;
        return;
    }

    accounts.forEach(acc => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="td-name">${escHtml(acc.name)}</td>
            <td class="td-balance">${fmt(acc.balance ?? 0, acc.currency || 'RUB')}</td>
            <td class="td-date">${fmtDate(acc.created_at)}</td>
            <td class="td-actions">
                <div class="td-actions-inner">
                    <button class="btn-icon btn-icon-copy" title="Копировать" data-id="${acc.id}">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    </button>
                    <button class="btn-icon btn-icon-edit" title="Редактировать" data-id="${acc.id}">
                        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                    <button class="btn-icon btn-icon-del" title="Удалить" data-id="${acc.id}" data-name="${escHtml(acc.name)}">
                        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>
            </td>
        `;

        tr.querySelector('.btn-icon-copy').addEventListener('click', () => openCopyModal(acc));
        tr.querySelector('.btn-icon-edit').addEventListener('click', () => openEditModal(acc));
        tr.querySelector('.btn-icon-del').addEventListener('click', () => openConfirm(acc.id, acc.name));

        tbody.appendChild(tr);
    });
}

async function loadAccounts() {
    const tbody = document.getElementById('accounts-tbody');
    try {
        const accounts = await apiFetch('/accounts');
        renderAccounts(accounts);
    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="state-error">Ошибка загрузки: ${escHtml(err.message)}</td></tr>`;
    }
}

// ── Modal ───────────────────────────────────────────
const overlay    = document.getElementById('account-modal-overlay');
const modalTitle = document.getElementById('modal-title');
const submitBtn  = document.getElementById('modal-submit-btn');
const fieldName  = document.getElementById('field-name');
const errName    = document.getElementById('err-name');
const errGlobal  = document.getElementById('err-global');

function clearErrors() {
    errName.textContent   = '';
    errGlobal.textContent = '';
    fieldName.classList.remove('invalid');
}

function openModal(title, submitLabel) {
    modalTitle.textContent = title;
    submitBtn.textContent  = submitLabel;
    submitBtn.disabled     = false;
    clearErrors();
    overlay.classList.add('open');
    fieldName.focus();
}

function closeModal() {
    overlay.classList.remove('open');
    editingId = null;
    document.getElementById('account-form').reset();
}

function openAddModal() {
    editingId = null;
    openModal('Добавить счёт', 'Добавить');
}

function openEditModal(acc) {
    editingId       = acc.id;
    fieldName.value = acc.name;
    openModal('Редактировать счёт', 'Сохранить');
}

function openCopyModal(acc) {
    editingId       = null;
    fieldName.value = 'Копия — ' + acc.name;
    openModal('Копировать счёт', 'Создать копию');
}

document.getElementById('add-account-btn').addEventListener('click', openAddModal);
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

// ── Form submit ─────────────────────────────────────
document.getElementById('account-form').addEventListener('submit', async e => {
    e.preventDefault();
    clearErrors();

    const name = fieldName.value.trim();

    if (!name) {
        errName.textContent = 'Введите название счёта';
        fieldName.classList.add('invalid');
        return;
    }

    submitBtn.disabled    = true;
    submitBtn.textContent = 'Сохранение…';

    const body = { name };

    try {
        if (editingId !== null) {
            await apiFetch(`/accounts/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
        } else {
            await apiFetch('/accounts', { method: 'POST', body: JSON.stringify(body) });
        }
        closeModal();
        loadAccounts();
    } catch (err) {
        errGlobal.textContent = err.message || 'Произошла ошибка';
        submitBtn.disabled    = false;
        submitBtn.textContent = editingId !== null ? 'Сохранить' : 'Добавить';
    }
});

// ── Confirm delete ──────────────────────────────────
let pendingDeleteId = null;

const confirmOverlay = document.getElementById('confirm-overlay');
const confirmText    = document.getElementById('confirm-text');

function openConfirm(id, name) {
    pendingDeleteId = id;
    confirmText.textContent = `Счёт «${name}» будет удалён. Это действие нельзя отменить.`;
    confirmOverlay.classList.add('open');
}

function closeConfirm() {
    confirmOverlay.classList.remove('open');
    pendingDeleteId = null;
}

document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirm);
confirmOverlay.addEventListener('click', e => { if (e.target === confirmOverlay) closeConfirm(); });

document.getElementById('confirm-ok-btn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    closeConfirm();
    try {
        await apiFetch(`/accounts/${id}`, { method: 'DELETE' });
        loadAccounts();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
});

// ── Keyboard ────────────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (confirmOverlay.classList.contains('open')) closeConfirm();
        else if (overlay.classList.contains('open')) closeModal();
        else if (document.getElementById('ib-modal-overlay').classList.contains('open')) closeIbModal();
    }
});

// ── Initial balances modal ───────────────────────────
let ibFunds = [];

const ibOverlay = document.getElementById('ib-modal-overlay');

function closeIbModal() { ibOverlay.classList.remove('open'); }

document.getElementById('ib-modal-close').addEventListener('click', closeIbModal);
document.getElementById('ib-modal-cancel').addEventListener('click', closeIbModal);
ibOverlay.addEventListener('click', e => { if (e.target === ibOverlay) closeIbModal(); });

document.getElementById('btn-initial-balances').addEventListener('click', async () => {
    // Set default date: Jan 1 of current year
    const year = new Date().getFullYear();
    document.getElementById('ib-date').value = `${year}-01-01`;

    // Load funds and existing initial balances in parallel
    const [funds, existing, accounts] = await Promise.all([
        apiFetch('/funds'),
        apiFetch('/transactions/initial-balances'),
        apiFetch('/accounts'),
    ]);
    ibFunds = funds;

    const thead = document.getElementById('ib-thead');
    const tbody = document.getElementById('ib-tbody');

    thead.innerHTML = '<tr><th>Фонд</th>' +
        accounts.map(a => `<th>${escHtml(a.name)}</th>`).join('') +
        '<th>Без счёта</th></tr>';

    tbody.innerHTML = '';
    funds.forEach(fund => {
        const tr = document.createElement('tr');
        let cells = `<td><strong>${escHtml(fund.name)}</strong></td>`;
        accounts.forEach(acc => {
            const ex = existing.find(t => t.fund_id === fund.id && t.account_id === acc.id);
            cells += `<td><input type="number" min="0" step="0.01" placeholder="0"
                data-fund="${fund.id}" data-account="${acc.id}" value="${ex ? ex.amount : ''}"></td>`;
        });
        const exNoAcc = existing.find(t => t.fund_id === fund.id && t.account_id === null);
        cells += `<td><input type="number" min="0" step="0.01" placeholder="0"
            data-fund="${fund.id}" data-account="" value="${exNoAcc ? exNoAcc.amount : ''}"></td>`;
        tr.innerHTML = cells;
        tbody.appendChild(tr);
    });

    ibOverlay.classList.add('open');
});

document.getElementById('ib-modal-save').addEventListener('click', async () => {
    const date = document.getElementById('ib-date').value;
    if (!date) { alert('Укажите дату остатков'); return; }

    const items = [];
    document.querySelectorAll('#ib-tbody input[type="number"]').forEach(inp => {
        const val = parseFloat(inp.value);
        if (!val || val <= 0) return;
        const fundId = parseInt(inp.dataset.fund);
        const accId = inp.dataset.account ? parseInt(inp.dataset.account) : null;
        items.push({ fund_id: fundId, account_id: accId, amount: val, date: date + 'T00:00:00' });
    });

    if (!items.length) { alert('Введите хотя бы одно значение'); return; }

    try {
        await apiFetch('/transactions/initial-balances', { method: 'POST', body: JSON.stringify({ items }) });
        closeIbModal();
    } catch (err) {
        alert('Ошибка: ' + err.message);
    }
});

// ── Init ─────────────────────────────────────────────
loadAccounts();
</script>
</body>
</html>
