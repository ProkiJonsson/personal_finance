<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Счета</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #1a6dff;
            --primary-dark: #1558d6;
            --primary-light: #eff4ff;
            --bg-body: #f5f7fb;
            --bg-card-light: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;
            
            --sidebar-w: 80px;
            --sidebar-w-expanded: 260px;
            --header-h: 64px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px;
            z-index: 100;
            transition: width 0.3s ease, padding 0.3s ease;
        }

        .sidebar.expanded {
            width: var(--sidebar-w-expanded);
            padding: 16px 20px;
            align-items: flex-start;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            width: 100%;
            flex-shrink: 0;
        }
        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sidebar-logo-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .sidebar-logo-text {
            display: none;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .sidebar.expanded .sidebar-logo-text { display: block; }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .nav-item {
            width: 100%; height: 48px;
            border: none; background: transparent;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            position: relative;
            gap: 12px;
            padding: 0 12px;
        }

        .nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: #fff; }
        .nav-item svg { width: 22px; height: 22px; }

        .nav-item .nav-tooltip {
            position: absolute;
            left: calc(100% + 12px);
            background: var(--text-primary);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        .nav-item:hover .nav-tooltip { opacity: 1; }

        .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        /* Header */
        .header {
            height: var(--header-h);
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav-item {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .header-nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .header-nav-item.active { color: var(--primary); background: var(--primary-light); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon-btn {
            width: 40px; height: 40px;
            border: none; background: transparent;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .header-icon-btn:hover { background: var(--primary-light); color: var(--primary); }
        .header-icon-btn svg { width: 20px; height: 20px; }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--bg-body);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-menu:hover { background: var(--primary-light); }

        .user-avatar {
            width: 32px; height: 32px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: #fff;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Page */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-width: 0;
        }

        body.sidebar-expanded .main-content {
            margin-left: var(--sidebar-w-expanded);
            transition: margin-left 0.3s ease;
        }

        .page {
            padding: 32px;
            max-width: 1400px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .page-header-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 109, 255, 0.3);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn svg { width: 18px; height: 18px; }

        /* Table */
        .table-container {
            background: var(--bg-card-light);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            padding: 16px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--primary-light); }

        tbody td {
            padding: 18px 20px;
            color: var(--text-primary);
            vertical-align: middle;
        }

        .td-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .td-name-icon {
            width: 40px; height: 40px;
            background: var(--primary-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .td-name-icon svg {
            width: 20px; height: 20px;
            color: var(--primary);
        }

        .td-balance {
            font-weight: 700;
            font-size: 16px;
            white-space: nowrap;
        }

        .td-date {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .td-actions {
            text-align: right;
            white-space: nowrap;
        }

        .td-actions-inner {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 34px; height: 34px;
            border: none;
            background: var(--bg-body);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .action-btn.delete:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .action-btn svg { width: 16px; height: 16px; }

        /* Empty State */
        .empty-state {
            padding: 80px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px; height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            to { background-position: -200% 0; }
        }

        .sk-row td { padding: 18px 20px; }
        .sk { display: block; height: 14px; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px; height: 36px;
            border: none; background: transparent;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .modal-close:hover { background: var(--bg-body); color: var(--text-primary); }
        .modal-close svg { width: 18px; height: 18px; }

        .modal-body { padding: 24px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fafafa;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-error {
            font-size: 12px;
            color: var(--danger);
            min-height: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }

        /* Confirm Modal */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .confirm-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .confirm-box {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            text-align: center;
        }

        .confirm-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .confirm-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: #b91c1c; }

        /* Initial Balances Modal */
        .modal-wide { max-width: 720px; }

        .ib-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-top: 16px;
        }

        .ib-table th {
            background: #fafafa;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
        }

        .ib-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        .ib-table input[type="number"] {
            width: 140px;
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fff;
            font-family: inherit;
        }

        .ib-table input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                bottom: 0; top: auto;
                flex-direction: row;
                padding: 12px;
                border-right: none;
                border-top: 1px solid var(--border);
            }

            .main-content { margin-left: 0; margin-bottom: 70px; }

            .header { padding: 0 16px; }
            .header-nav { display: none; }
            .page { padding: 16px; }
            .page-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .table-wrapper { overflow-x: scroll; }
        }
    
        .sidebar-toggle {
            width: 100%;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            margin-bottom: 16px;
            padding: 0;
        }
        .sidebar-toggle:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .sidebar-toggle svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }
        .sidebar:not(.expanded) .sidebar-toggle svg {
            transform: rotate(180deg);
        }
        .nav-item-text {
            display: none;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
        }
        .sidebar.expanded .nav-item-text {
            display: block;
        }
        .sidebar:not(.expanded) .nav-item {
            justify-content: center;
        }
        .sidebar.expanded .nav-item {
            justify-content: flex-start;
        }
        .sidebar.expanded .nav-item .nav-tooltip {
            display: none;
        }
        .sidebar:not(.expanded) .nav-item:hover .nav-tooltip {
            opacity: 1;
        }

    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-icon">
            <svg viewBox="0 0 24 24">
                <path d="M8 4v16M8 4h5a4 4 0 0 1 0 8H8M6 12h7M6 16h7"/>
            </svg>
        </div>
        <span class="sidebar-logo-text">МОЯ ПРИБЫЛЬ</span>
    </div>

    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Развернуть/свернуть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
    </button>

    <nav class="sidebar-nav">
        <button class="nav-item" onclick="location.href='dashboard.html'">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span class="nav-item-text">Главная</span>
            <span class="nav-tooltip">Главная</span>
        </button>
        <button class="nav-item" onclick="location.href='operations.html'">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6zm0 4h8v2H6zm10 0h2v2h-2zm-6-4h8v2h-8z"/>
            </svg>
            <span class="nav-item-text">Операции</span>
            <span class="nav-tooltip">Операции</span>
        </button>
        <button class="nav-item" onclick="location.href='funds.html'">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
            </svg>
            <span class="nav-item-text">Фонды</span>
            <span class="nav-tooltip">Фонды</span>
        </button>
        <button class="nav-item active" onclick="location.href='accounts.html'">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/>
            </svg>
            <span class="nav-item-text">Счета</span>
            <span class="nav-tooltip">Счета</span>
        </button>
    </nav>

    <div class="sidebar-bottom">
        <button class="nav-item" onclick="location.href='categories.html'">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 14H8v-2h8v2zm0-4H8v-2h8v2zm0-4H8V6h8v2z"/>
            </svg>
            <span class="nav-item-text">Справочники</span>
            <span class="nav-tooltip">Справочники</span>
        </button>
        <button class="nav-item" id="logout-btn">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            <span class="nav-item-text">Выйти</span>
            <span class="nav-tooltip">Выйти</span>
        </button>
    </div>
</aside>

<!-- Main Content -->
<main class="main-content">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1 class="header-title">Счета</h1>
            <nav class="header-nav">
                <a href="dashboard.html" class="header-nav-item">Главная</a>
                <a href="operations.html" class="header-nav-item">Операции</a>
                <a href="funds.html" class="header-nav-item">Фонды</a>
                <a href="accounts.html" class="header-nav-item active">Счета</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="header-icon-btn" aria-label="Поиск">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
            </button>
            <button class="header-icon-btn" aria-label="Уведомления">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </button>
            <div class="user-menu">
                <div class="user-avatar" id="user-avatar">?</div>
                <span class="user-name" id="user-name">Загрузка...</span>
            </div>

<div class="modal-overlay" id="ib-modal">
    <div class="modal modal-wide">
        <div class="modal-header">
            <h3 class="modal-title">Начальные остатки</h3>
            <button class="modal-close" id="ib-modal-close">

            <button class="btn btn-primary" id="ib-modal-save">Сохранить</button>

<script>
const API = 'http://127.0.0.1:8000';

// Auth guard
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// Decode JWT
function parseJwt(t) {
    try {
        const payload = t.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
    } catch { return {}; }
}

const jwt = parseJwt(token);
const displayName = jwt.name || jwt.email || 'Пользователь';
document.getElementById('user-name').textContent = displayName;
document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

// Logout
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}
document.getElementById('logout-btn').addEventListener('click', logout);

// API fetch
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// Formatters
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function fmtDate(iso) {
    return new Date(iso).toLocaleDateString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
    });
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Render accounts
function renderAccounts(accounts) {
    const tbody = document.getElementById('accounts-tbody');
    tbody.innerHTML = '';

    if (!accounts.length) {
        tbody.innerHTML = `
            <tr>
                <td colspan="4">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                        <h3>Счетов пока нет</h3>
                        <p>Добавьте первый счёт для учёта средств</p>
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    accounts.forEach(acc => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <div class="td-name">
                    <div class="td-name-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
                        </svg>
                    </div>
                    <span>${escHtml(acc.name)}</span>
                </div>
            </td>
            <td class="td-balance">${fmt(acc.balance)}</td>
            <td class="td-date">${fmtDate(acc.created_at)}</td>
            <td class="td-actions">
                <div class="td-actions-inner">
                    <button class="action-btn" onclick="editAccount(${acc.id})" aria-label="Редактировать">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="action-btn delete" onclick="deleteAccount(${acc.id})" aria-label="Удалить">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Modal handling
const accountModal = document.getElementById('account-modal');
let editingId = null;

function openModal(edit = false) {
    editingId = edit ? null : null;
    document.getElementById('modal-title').textContent = edit ? 'Редактировать счёт' : 'Добавить счёт';
    document.getElementById('account-name').value = '';
    document.getElementById('err-name').textContent = '';
    document.getElementById('err-global').textContent = '';
    accountModal.classList.add('open');
}

function closeModal() {
    accountModal.classList.remove('open');
    editingId = null;
}

document.getElementById('add-account-btn').addEventListener('click', () => openModal());
document.getElementById('add-btn').addEventListener('click', () => openModal());
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
accountModal.addEventListener('click', (e) => {
    if (e.target === accountModal) closeModal();
});

// Form submit
document.getElementById('account-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('account-name').value.trim();

    if (!name) {
        document.getElementById('err-name').textContent = 'Введите название';
        return;
    }

    try {
        if (editingId) {
            await apiFetch(`/accounts/${editingId}`, {
                method: 'PUT',
                body: JSON.stringify({ name }),
            });
        } else {
            await apiFetch('/accounts', {
                method: 'POST',
                body: JSON.stringify({ name, balance: 0 }),
            });
        }
        closeModal();
        loadAccounts();
    } catch (err) {
        document.getElementById('err-global').textContent = err.message;
    }
});

// Delete confirmation
const confirmModal = document.getElementById('confirm-modal');
let deleteId = null;

function showConfirm(id) {
    deleteId = id;
    confirmModal.classList.add('open');
}

function hideConfirm() {
    confirmModal.classList.remove('open');
    deleteId = null;
}

document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) hideConfirm();
});

document.getElementById('confirm-ok').addEventListener('click', async () => {
    if (!deleteId) return;
    try {
        await apiFetch(`/accounts/${deleteId}`, { method: 'DELETE' });
        hideConfirm();
        loadAccounts();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
});

// Load accounts
async function loadAccounts() {
    const tbody = document.getElementById('accounts-tbody');
    try {
        const accounts = await apiFetch('/accounts');
        renderAccounts(accounts);
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><h3>Ошибка загрузки</h3></td></tr>';
    }
}

// Initial Balances Modal
const ibModal = document.getElementById('ib-modal');

document.getElementById('initial-balances-btn').addEventListener('click', async () => {
    document.getElementById('ib-date').valueAsDate = new Date();
    
    try {
        const accounts = await apiFetch('/accounts');
        const thead = document.getElementById('ib-thead');
        const tbody = document.getElementById('ib-tbody');
        
        thead.innerHTML = '<tr><th>Счёт</th><th>Текущий баланс</th><th>Новый баланс</th></tr>';
        tbody.innerHTML = '';
        
        accounts.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escHtml(acc.name)}</td>
                <td>${fmt(acc.balance)}</td>
                <td><input type="number" data-id="${acc.id}" value="${acc.balance}" step="0.01"></td>
            `;
            tbody.appendChild(tr);
        });
        
        ibModal.classList.add('open');
    } catch (err) {
        alert('Ошибка загрузки: ' + err.message);
    }
});

document.getElementById('ib-modal-close').addEventListener('click', () => {
    ibModal.classList.remove('open');
});

document.getElementById('ib-modal-cancel').addEventListener('click', () => {
    ibModal.classList.remove('open');
});

ibModal.addEventListener('click', (e) => {
    if (e.target === ibModal) ibModal.classList.remove('open');
});

document.getElementById('ib-modal-save').addEventListener('click', async () => {
    const inputs = document.querySelectorAll('#ib-tbody input');
    const date = document.getElementById('ib-date').value;
    
    try {
        for (const input of inputs) {
            const id = input.dataset.id;
            const balance = parseFloat(input.value);
            if (!isNaN(balance)) {
                await apiFetch(`/accounts/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({ balance }),
                });
            }
        }
        ibModal.classList.remove('open');
        loadAccounts();
    } catch (err) {
        alert('Ошибка сохранения: ' + err.message);
    }
});

// Placeholder functions
function editAccount(id) {
    console.log('Edit account:', id);
    // TODO: Load account data and open modal
}

function deleteAccount(id) {
    showConfirm(id);
}

// Init
loadAccounts();

    // Sidebar toggle
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    if (sidebar && sidebarToggle) {
        const SIDEBAR_STATE_KEY = 'sidebar_expanded';
        const isExpanded = localStorage.getItem(SIDEBAR_STATE_KEY) === 'true';
        if (isExpanded) {
            sidebar.classList.add('expanded');
            document.body.classList.add('sidebar-expanded');
        }
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('expanded');
            document.body.classList.toggle('sidebar-expanded');
            localStorage.setItem(SIDEBAR_STATE_KEY, sidebar.classList.contains('expanded'));
        });
    }
</script>
</body>
