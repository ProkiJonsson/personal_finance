<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личные финансы — Справочники</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --blue: #1a6dff;
        --blue-dark: #1558d6;
        --blue-light: #eff4ff;
        --sidebar-w: 240px;
        --header-h: 64px;
        --text: #111827;
        --text-muted: #6b7280;
        --border: #e5e7eb;
        --bg: #f5f7fb;
        --white: #ffffff;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Sidebar ─────────────────────────────────── */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--sidebar-w);
        height: 100vh;
        background: var(--white);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        z-index: 50;
      }
      .sidebar-logo {
        height: var(--header-h);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .sidebar-logo-icon {
        width: 34px;
        height: 34px;
        background: var(--blue);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .sidebar-logo-icon svg {
        width: 18px;
        height: 18px;
        fill: #fff;
      }
      .sidebar-logo span {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .sidebar-nav {
        flex: 1;
        padding: 12px 10px;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-muted);
        text-decoration: none;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
      }
      .nav-item:hover {
        background: var(--blue-light);
        color: var(--blue);
      }
      .nav-item.active {
        background: var(--blue-light);
        color: var(--blue);
        font-weight: 600;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .nav-section {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.07em;
        color: #9ca3af;
        text-transform: uppercase;
        padding: 16px 12px 6px;
      }
      .sidebar-bottom {
        padding: 10px;
        border-top: 1px solid var(--border);
      }

      /* ── Header ──────────────────────────────────── */
      .header {
        position: fixed;
        top: 0;
        left: var(--sidebar-w);
        right: 0;
        height: var(--header-h);
        background: var(--white);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 28px;
        gap: 14px;
        z-index: 40;
      }
      .header-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
      }
      .header-spacer {
        flex: 1;
      }
      .header-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-avatar {
        width: 34px;
        height: 34px;
        background: var(--blue-light);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
        color: var(--blue);
        flex-shrink: 0;
      }
      .user-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        text-decoration: none;
      }
      .user-name:hover {
        color: var(--blue);
      }
      .btn-logout {
        padding: 7px 16px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        background: none;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
      }
      .btn-logout:hover {
        border-color: #ef4444;
        color: #ef4444;
      }

      /* ── Content ──────────────────────────────────── */
      .content {
        margin-left: var(--sidebar-w);
        padding-top: var(--header-h);
        min-height: 100vh;
      }
      .page {
        padding: 28px 28px 40px;
        max-width: 1200px;
      }

      .page-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }
      .page-header h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
      }

      /* ── Section header ───────────────────────────── */
      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .section-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      /* ── Buttons ──────────────────────────────────── */
      .btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 8px 16px;
        background: var(--blue);
        color: #fff;
        border: none;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .btn-primary:hover {
        background: var(--blue-dark);
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .btn-primary svg {
        width: 15px;
        height: 15px;
        fill: #fff;
      }

      .btn-secondary {
        padding: 9px 18px;
        border: 1.5px solid var(--border);
        border-radius: 9px;
        background: none;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color 0.2s, color 0.2s;
        font-family: inherit;
      }
      .btn-secondary:hover {
        border-color: #9ca3af;
        color: var(--text);
      }

      .btn-danger {
        padding: 9px 18px;
        background: #dc2626;
        color: #fff;
        border: none;
        border-radius: 9px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .btn-danger:hover {
        background: #b91c1c;
      }

      .btn-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        border: 1.5px solid var(--border);
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
        flex-shrink: 0;
      }
      .btn-icon svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }
      .btn-icon:hover {
        background: var(--blue-light);
        border-color: var(--blue);
        color: var(--blue);
      }
      .btn-icon:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-icon-del:hover {
        background: #fef2f2;
        border-color: #fca5a5;
        color: #dc2626;
      }

      /* ── Table ────────────────────────────────────── */
      .table-wrap {
        background: var(--white);
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      thead th {
        background: #f9fafb;
        padding: 11px 16px;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      tbody tr {
        border-bottom: 1px solid var(--border);
        transition: background 0.12s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #fafbff;
      }
      tbody td {
        padding: 12px 16px;
        color: var(--text);
        vertical-align: middle;
      }
      .td-name {
        font-weight: 500;
      }
      .td-actions {
        white-space: nowrap;
      }
      .td-actions-inner {
        display: flex;
        gap: 6px;
      }

      /* ── Badges ───────────────────────────────────── */
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 20px;
      }
      .badge-income {
        background: #f0fdf4;
        color: #16a34a;
      }
      .badge-expense {
        background: #fef2f2;
        color: #dc2626;
      }
      .badge-neutral {
        background: #f3f4f6;
        color: #6b7280;
      }

      /* ── Tree view ────────────────────────────────── */
      .tree-wrap {
        background: var(--white);
        border-radius: 14px;
        border: 1px solid var(--border);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        padding: 8px;
      }

      .tree-node {
        display: flex;
        align-items: center;
        min-height: 40px;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 14px;
        transition: background 0.1s;
      }

      .tree-node:hover {
        background: #fafbff;
      }
      .tree-node.dragging {
        opacity: 0.4;
      }
      .tree-node.drag-over-top {
        border-top: 2px solid var(--blue);
      }
      .tree-node.drag-over-bottom {
        border-bottom: 2px solid var(--blue);
      }
      .drag-handle {
        cursor: grab;
        color: var(--text-muted);
        padding: 0 4px;
        border: none;
        background: none;
        display: flex;
        align-items: center;
        flex-shrink: 0;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .drag-handle svg { width: 14px; height: 14px; }
      .tree-node:hover .drag-handle { opacity: 1; }

      /* ── Income / Expense section headers in tree ─ */
      .type-section-header {
        display: flex;
        align-items: center;
        padding: 4px 12px;
        margin: 4px 0 2px;
      }
      .type-section-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 2px 10px;
        border-radius: 20px;
      }
      .type-section-header.type-section-income .type-section-label {
        background: #f0fdf4;
        color: #16a34a;
      }
      .type-section-header.type-section-expense .type-section-label {
        background: #fef2f2;
        color: #dc2626;
      }

      .tree-toggle {
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
        color: var(--text-muted);
      }

      .tree-toggle:hover {
        color: var(--blue);
      }

      /* ── States ───────────────────────────────────── */
      .state-empty {
        padding: 50px 20px;
        text-align: center;
        color: var(--text-muted);
        font-size: 14px;
      }

      .state-error {
        padding: 50px 20px;
        text-align: center;
        color: #dc2626;
        font-size: 14px;
      }

      /* ── Skeleton ─────────────────────────────────── */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 4px;
        display: inline-block;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      .sk-row td {
        padding: 13px 16px;
      }
      .sk {
        display: block;
        height: 14px;
        border-radius: 4px;
      }

      /* ── Modal ────────────────────────────────────── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .modal {
        background: var(--white);
        border-radius: 16px;
        padding: 28px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        transform: translateY(12px);
        transition: transform 0.2s;
      }
      .modal-overlay.open .modal {
        transform: translateY(0);
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .modal-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text);
      }
      .modal-close {
        width: 30px;
        height: 30px;
        border: none;
        background: none;
        cursor: pointer;
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        transition: background 0.15s;
      }
      .modal-close:hover {
        background: #f3f4f6;
      }
      .modal-close svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
      }
      .form-group input,
      .form-group select {
        padding: 10px 13px;
        border: 1.5px solid var(--border);
        border-radius: 9px;
        font-size: 14px;
        color: var(--text);
        background: var(--white);
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--blue);
      }
      .form-group input.invalid,
      .form-group select.invalid {
        border-color: #dc2626;
      }
      .form-error {
        font-size: 12px;
        color: #dc2626;
        min-height: 16px;
      }
      .modal-footer {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }

      /* ── Confirm ──────────────────────────────────── */
      .confirm-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 300;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .confirm-overlay.open {
        opacity: 1;
        pointer-events: all;
      }
      .confirm-box {
        background: var(--white);
        border-radius: 16px;
        padding: 28px;
        width: 100%;
        max-width: 360px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
        transform: translateY(12px);
        transition: transform 0.2s;
      }
      .confirm-overlay.open .confirm-box {
        transform: translateY(0);
      }
      .confirm-box h3 {
        font-size: 16px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 10px;
      }
      .confirm-box p {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 22px;
        line-height: 1.5;
      }
      .confirm-footer {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
    </style>
  </head>

    <!-- ── Confirm dialog ─────────────────────────────────── -->
    <div class="confirm-overlay" id="confirm-overlay">
      <div class="confirm-box" role="dialog" aria-modal="true">
        <h3 id="confirm-title">Удалить?</h3>
        <p id="confirm-text">Это действие нельзя отменить.</p>
        <div class="confirm-footer">
          <button class="btn-secondary" id="confirm-cancel">Отмена</button>
          <button class="btn-danger" id="confirm-ok">Удалить</button>
        </div>

    <script>
      const API = "http://127.0.0.1:8000";

      // ── Auth guard ──────────────────────────────────────
      const token =
        localStorage.getItem("token") || sessionStorage.getItem("token");
      if (!token) {
        window.location.href = "index.html";
      }

      function parseJwt(t) {
        try {
          return JSON.parse(
            atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")),
          );
        } catch {
          return {};
        }
      }
      const jwtPayload = parseJwt(token);
      const displayName =
        jwtPayload.name || jwtPayload.email || "Пользователь";
      document.getElementById("user-name").textContent = displayName;
      document.getElementById("user-avatar").textContent =
        displayName.charAt(0).toUpperCase();

      // ── Logout ──────────────────────────────────────────
      function logout() {
        localStorage.removeItem("token");
        sessionStorage.removeItem("token");
        window.location.href = "index.html";
      }
      document.getElementById("logout-btn").addEventListener("click", logout);
      document
        .getElementById("header-logout-btn")
        .addEventListener("click", logout);

      // ── API helper ──────────────────────────────────────
      async function apiFetch(path, options = {}) {
        const res = await fetch(API + path, {
          ...options,
          headers: {
            Authorization: "Bearer " + token,
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
        if (res.status === 401) logout();
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || "HTTP " + res.status);
        }
        if (res.status === 204) return null;
        return res.json();
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function typeBadge(type) {
        if (type === "income")
          return `<span class="badge badge-income">Доходы</span>`;
        if (type === "expense")
          return `<span class="badge badge-expense">Расходы</span>`;
        return `<span class="badge badge-neutral">—</span>`;
      }

      // ── State ───────────────────────────────────────────
      let allCategories = [];
      let expandedNodes = new Set();
      let editingNodeId = null;
      let editingNodeParent = null;
      let draggedId = null;
      let dragStartX = 0;

      const LEVEL_NAMES = { 4: "Вид деятельности", 3: "Группа", 2: "Статья" };

      // ── Load all ────────────────────────────────────────
      async function loadAll() {
        allCategories = await apiFetch("/categories");
      }

      // ── Save sort order ─────────────────────────────────
      async function saveSortOrder(siblings) {
        await Promise.all(siblings.map((node, i) =>
          apiFetch(`/categories/${node.id}`, {
            method: "PUT",
            body: JSON.stringify({ name: node.name, type: node.type || null, sort_order: i * 10 }),
          })
        ));
        siblings.forEach((node, i) => {
          const cat = allCategories.find(c => c.id === node.id);
          if (cat) cat.sort_order = i * 10;
        });
      }

      // ── Indent (вправо) / Outdent (влево) ───────────────
      async function indentNode(node) {
        if (node.level <= 2) { alert("Нельзя углубить: уже самый глубокий уровень"); return; }
        const hasChildren = allCategories.some(c => c.parent_id === node.id);
        if (hasChildren) { alert("Нельзя углубить категорию с подкатегориями"); return; }
        const siblings = allCategories
          .filter(c => (c.parent_id ?? null) === (node.parent_id ?? null) && c.level === node.level)
          .sort((a, b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, "ru"));
        const myIdx = siblings.findIndex(c => c.id === node.id);
        if (myIdx <= 0) { alert("Нет предыдущего элемента: некуда вложить"); return; }
        const newParent = siblings[myIdx - 1];
        const newChildren = allCategories.filter(c => c.parent_id === newParent.id);
        const maxSort = newChildren.reduce((m, c) => Math.max(m, c.sort_order ?? 0), -10);
        try {
          await apiFetch(`/categories/${node.id}/move`, {
            method: "PATCH",
            body: JSON.stringify({ level: node.level - 1, parent_id: newParent.id, sort_order: maxSort + 10 }),
          });
          expandedNodes.add(newParent.id);
          await reload();
        } catch (err) { alert("Ошибка: " + err.message); }
      }

      async function outdentNode(node) {
        if (node.level >= 4) { alert("Нельзя: уже верхний уровень"); return; }
        const parent = allCategories.find(c => c.id === node.parent_id);
        const newParentId = parent ? (parent.parent_id ?? null) : null;
        const newLevel = node.level + 1;
        const newSiblings = allCategories.filter(c =>
          (c.parent_id ?? null) === (newParentId ?? null) && c.level === newLevel
        );
        const maxSort = newSiblings.reduce((m, c) => Math.max(m, c.sort_order ?? 0), -10);
        try {
          await apiFetch(`/categories/${node.id}/move`, {
            method: "PATCH",
            body: JSON.stringify({ level: newLevel, parent_id: newParentId, sort_order: maxSort + 10 }),
          });
          await reload();
        } catch (err) { alert("Ошибка: " + err.message); }
      }

      // ── Tree building ────────────────────────────────────
      function buildTree(categories) {
        const byId = new Map(
          categories.map((c) => [c.id, { ...c, children: [] }]),
        );
        const roots = [];
        byId.forEach((node) => {
          if (node.parent_id && byId.has(node.parent_id)) {
            byId.get(node.parent_id).children.push(node);
          } else if (!node.parent_id && node.level === 4) {
            roots.push(node);
          }
        });
        function sortNodes(arr) {
          arr.sort((a, b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, "ru"));
          arr.forEach(n => sortNodes(n.children));
        }
        sortNodes(roots);
        return roots;
      }

      // ── Render main tree ─────────────────────────────────
      function renderMainTree() {
        const container = document.getElementById("main-tree");
        const tree = buildTree(allCategories);
        container.innerHTML = "";

        if (!tree.length) {
          container.innerHTML =
            `<div class="state-empty">Нет категорий. Добавьте группу или вид деятельности.</div>`;
          return;
        }

        function renderNode(node, level = 0) {
          const nodeEl = document.createElement("div");
          nodeEl.className = "tree-node";
          nodeEl.style.paddingLeft = level * 24 + "px";
          nodeEl.dataset.id = node.id;
          nodeEl.dataset.level = node.level;
          nodeEl.draggable = true;
          const isExpanded = expandedNodes.has(node.id);
          const hasChildren =
            node.children && node.children.length > 0 && level < 3;

          let html = `<div style="display: flex; align-items: center; gap: 8px; flex: 1;">`;
          html += `<button class="drag-handle" draggable="false" title="Перетащить"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 18c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2-8c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 4c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></button>`;

          // Collapse/expand button
          if (hasChildren) {
            html += `<button class="tree-toggle" data-id="${node.id}" style="width: 24px; height: 24px; padding: 0; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: transform 0.15s;">
              <svg style="width: 16px; height: 16px; transform: rotate(${isExpanded ? 90 : 0}deg); transition: transform 0.15s;" viewBox="0 0 24 24"><path fill="currentColor" d="M8.59 16.58L10 18l6-6-6-6-1.41 1.41L12.17 12z"/></svg>
            </button>`;
          } else {
            html += `<div style="width: 24px;"></div>`;
          }

          // Level icon & name
          const levelLabel =
            node.level === 4
              ? "📊"
              : node.level === 3
                ? "📁"
                : node.level === 2
                  ? "📄"
                  : "•";
          html += `<span style="font-weight: ${node.level === 4 ? "600" : "500"}; flex-wrap: wrap;">${levelLabel} ${escHtml(node.name)}</span>`;

          html += `<div style="flex: 1;"></div>`;

          // Actions menu
          html += `<div style="display: flex; gap: 6px;">
            <button class="btn-icon tree-edit" data-id="${node.id}" title="Редактировать">
              <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <button class="btn-icon tree-add-child" data-id="${node.id}" data-level="${node.level}" ${node.level === 2 ? "disabled" : ""} title="Добавить подкатегорию">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
            ${node.level === 2 ? `<button class="btn-icon tree-copy" data-id="${node.id}" title="Копировать"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></button>` : ""}
            <button class="btn-icon tree-delete" data-id="${node.id}" title="Удалить">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>`;
          html += `</div>`;
          nodeEl.innerHTML = html;

          // Attach buttons
          nodeEl.querySelector(".tree-toggle")?.addEventListener("click", (e) => {
            e.stopPropagation();
            if (expandedNodes.has(node.id)) {
              expandedNodes.delete(node.id);
            } else {
              expandedNodes.add(node.id);
            }
            renderMainTree();
          });

          nodeEl.querySelector(".tree-edit")?.addEventListener("click", (e) => {
            e.stopPropagation();
            openEditNode(node);
          });

          nodeEl
            .querySelector(".tree-add-child")
            ?.addEventListener("click", (e) => {
              e.stopPropagation();
              openAddChild(node);
            });

          nodeEl.querySelector(".tree-copy")?.addEventListener("click", (e) => {
            e.stopPropagation();
            openCopyArticle(node);
          });

          nodeEl.querySelector(".tree-delete")?.addEventListener("click", (e) => {
            e.stopPropagation();
            openConfirm(node.id, node.name, "category");
          });

          // ── Drag events ──────────────────────────────────
          const hint = document.getElementById("drag-level-hint");

          nodeEl.addEventListener("dragstart", (e) => {
            draggedId = node.id;
            dragStartX = e.clientX;
            e.dataTransfer.effectAllowed = "move";
            requestAnimationFrame(() => nodeEl.classList.add("dragging"));
          });

          nodeEl.addEventListener("dragend", () => {
            draggedId = null;
            hint.style.display = "none";
            document.querySelectorAll(".tree-node").forEach(el =>
              el.classList.remove("dragging", "drag-over-top", "drag-over-bottom")
            );
          });

          nodeEl.addEventListener("dragover", (e) => {
            if (!draggedId) return;
            const dragged = allCategories.find(c => c.id === draggedId);
            if (!dragged) return;

            const deltaX = e.clientX - dragStartX;

            if (Math.abs(deltaX) > 30) {
              // Горизонтальное перетаскивание → смена уровня
              const newLevel = deltaX > 0 ? dragged.level - 1 : dragged.level + 1;
              const name = LEVEL_NAMES[newLevel];
              if (name) {
                hint.textContent = (deltaX > 0 ? "→ " : "← ") + name;
                hint.style.display = "block";
                hint.style.left = (e.clientX + 14) + "px";
                hint.style.top = (e.clientY - 12) + "px";
              } else {
                hint.style.display = "none";
              }
              document.querySelectorAll(".tree-node").forEach(el =>
                el.classList.remove("drag-over-top", "drag-over-bottom")
              );
              e.preventDefault();
              return;
            }

            hint.style.display = "none";
            // Вертикальное перетаскивание — разрешаем любой узел того же уровня
            if (draggedId === node.id) return;
            if (dragged.level !== node.level) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            const rect = nodeEl.getBoundingClientRect();
            document.querySelectorAll(".tree-node").forEach(el =>
              el.classList.remove("drag-over-top", "drag-over-bottom")
            );
            nodeEl.classList.add(e.clientY < rect.top + rect.height / 2 ? "drag-over-top" : "drag-over-bottom");
          });

          nodeEl.addEventListener("dragleave", () => {
            nodeEl.classList.remove("drag-over-top", "drag-over-bottom");
          });

          nodeEl.addEventListener("drop", async (e) => {
            e.preventDefault();
            nodeEl.classList.remove("drag-over-top", "drag-over-bottom");
            hint.style.display = "none";
            if (!draggedId) return;
            const dragged = allCategories.find(c => c.id === draggedId);
            if (!dragged) return;

            const deltaX = e.clientX - dragStartX;

            // Горизонтальное перетаскивание → indent / outdent
            if (Math.abs(deltaX) > 30) {
              if (deltaX > 0) await indentNode(dragged);
              else await outdentNode(dragged);
              return;
            }

            // Вертикальное — требуется одинаковый уровень
            if (draggedId === node.id) return;
            if (dragged.level !== node.level) return;

            const fromParentId = dragged.parent_id ?? null;
            const toParentId = node.parent_id ?? null;
            const rect = nodeEl.getBoundingClientRect();
            const insertAfter = e.clientY >= rect.top + rect.height / 2;

            if (fromParentId === toParentId) {
              // Тот же родитель — только переупорядочиваем
              const siblings = allCategories
                .filter(c => (c.parent_id ?? null) === toParentId && c.level === node.level)
                .sort((a, b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, "ru"));
              const fromIdx = siblings.findIndex(c => c.id === draggedId);
              siblings.splice(fromIdx, 1);
              let toIdx = siblings.findIndex(c => c.id === node.id);
              if (insertAfter) toIdx += 1;
              siblings.splice(toIdx, 0, dragged);
              try {
                await saveSortOrder(siblings);
              } catch (err) {
                alert("Ошибка сохранения порядка: " + err.message);
              }
              renderActivitiesReference();
              renderMainTree();
            } else {
              // Другой родитель — меняем parent_id через /move
              const newSiblings = allCategories
                .filter(c => (c.parent_id ?? null) === toParentId && c.level === node.level && c.id !== dragged.id)
                .sort((a, b) => (a.sort_order - b.sort_order) || a.name.localeCompare(b.name, "ru"));
              let toIdx = newSiblings.findIndex(c => c.id === node.id);
              if (insertAfter) toIdx += 1;
              newSiblings.splice(toIdx, 0, dragged);
              try {
                await apiFetch(`/categories/${dragged.id}/move`, {
                  method: "PATCH",
                  body: JSON.stringify({ level: dragged.level, parent_id: toParentId, sort_order: toIdx * 10 }),
                });
                dragged.parent_id = toParentId;
                dragged.sort_order = toIdx * 10;
                await saveSortOrder(newSiblings);
              } catch (err) {
                alert("Ошибка перемещения: " + err.message);
              }
              await reload();
            }
          });

          container.appendChild(nodeEl);

          // Render children if expanded
          if (hasChildren && isExpanded) {
            if (node.level === 4) {
              // Group level-3 children by type: Доходы first, then Расходы
              const incomeKids = node.children.filter(c => c.type === "income");
              const expenseKids = node.children.filter(c => c.type === "expense");
              const otherKids = node.children.filter(c => !c.type);

              const renderTypeHeader = (label, cls) => {
                const hdr = document.createElement("div");
                hdr.className = `type-section-header type-section-${cls}`;
                hdr.style.paddingLeft = (level + 1) * 24 + 12 + "px";
                hdr.innerHTML = `<span class="type-section-label">${label}</span>`;
                container.appendChild(hdr);
              };

              if (incomeKids.length) {
                renderTypeHeader("Доходы", "income");
                incomeKids.forEach(c => renderNode(c, level + 1));
              }
              if (expenseKids.length) {
                renderTypeHeader("Расходы", "expense");
                expenseKids.forEach(c => renderNode(c, level + 1));
              }
              otherKids.forEach(c => renderNode(c, level + 1));
            } else {
              node.children.forEach((child) => renderNode(child, level + 1));
            }
          }
        }

        tree.forEach((node) => renderNode(node));
      }

      // ── Render activities reference (справочник) ────────
      function renderActivitiesReference() {
        const tbody = document.getElementById("activities-tbody");
        const activities = allCategories.filter((c) => c.level === 4);
        tbody.innerHTML = "";

        if (!activities.length) {
          tbody.innerHTML =
            `<tr><td colspan="2" class="state-empty">Видов деятельности пока нет</td></tr>`;
          return;
        }

        activities.forEach((a) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="td-name">${escHtml(a.name)}</td>
            <td class="td-actions">
              <div class="td-actions-inner">
                <button class="btn-icon btn-icon-edit act-edit" data-id="${a.id}" title="Редактировать">
                  <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
                <button class="btn-icon btn-icon-del act-delete" data-id="${a.id}" title="Удалить">
                  <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
              </div>
            </td>
          `;
          tr.querySelector(".act-edit").addEventListener("click", () => {
            openEditNode(a);
          });
          tr.querySelector(".act-delete").addEventListener("click", () => {
            openConfirm(a.id, a.name, "category");
          });
          tbody.appendChild(tr);
        });
      }

      async function reload() {
        try {
          await loadAll();
          renderActivitiesReference();
          renderMainTree();
        } catch (err) {
          alert("Ошибка загрузки: " + err.message);
        }
      }

      // ── Modal helpers ───────────────────────────────────
      function openOverlay(id) {
        document.getElementById(id).classList.add("open");
      }
      function closeOverlay(id) {
        document.getElementById(id).classList.remove("open");
      }

      function populateSelect(selectEl, items, valueFn, labelFn) {
        while (selectEl.options.length > 1) selectEl.remove(1);
        items.forEach((item) => {
          const opt = document.createElement("option");
          opt.value = valueFn(item);
          opt.textContent = labelFn(item);
          selectEl.appendChild(opt);
        });
      }

      // Type toggle buttons
      document.querySelectorAll(".btn-type-toggle").forEach((btn) => {
        btn.addEventListener("click", function(e) {
          e.preventDefault();
          document.querySelectorAll(".btn-type-toggle").forEach((b) => {
            b.style.background = "none";
            b.style.color = "var(--text-muted)";
          });
          this.style.background = this.dataset.type === "income" ? "#f0fdf4" : "#fef2f2";
          this.style.color = this.dataset.type === "income" ? "#16a34a" : "#dc2626";
          this.style.borderColor = this.dataset.type === "income" ? "#86efac" : "#fca5a5";
          document.getElementById("category-type").value = this.dataset.type;
        });
      });

      // Close buttons
      document
        .querySelectorAll(".js-close-category")
        .forEach((el) =>
          el.addEventListener("click", () => closeOverlay("category-modal")),
        );

      // Закрытие category-modal по клику вне окна намеренно отключено

      // ── Category modal ──────────────────────────────────
      function openAddActivity() {
        editingNodeId = null;
        editingNodeParent = null;
        document.getElementById("category-modal-title").textContent =
          "Добавить вид деятельности";
        document.getElementById("category-name").value = "";
        document.getElementById("category-name").placeholder =
          "Например: Операционная";
        document.getElementById("category-type-group").style.display = "none";
        document.getElementById("category-parent-group").style.display = "none";
        document.getElementById("category-err-name").textContent = "";
        document.getElementById("category-err-global").textContent = "";
        document.getElementById("category-submit").textContent = "Добавить";
        openOverlay("category-modal");
        document.getElementById("category-name").focus();
      }

      function openEditNode(node) {
        editingNodeId = node.id;
        editingNodeParent = node.parent_id;
        const levelLabels = {
          4: "вид деятельности",
          3: "группу",
          2: "статью",
        };
        document.getElementById("category-modal-title").textContent =
          "Редактировать " + levelLabels[node.level];
        document.getElementById("category-name").value = node.name;
        document.getElementById("category-err-name").textContent = "";
        document.getElementById("category-err-global").textContent = "";

        if (node.level >= 3) {
          document.getElementById("category-type-group").style.display = "block";
          document.getElementById("category-type").value = node.type || "";
          // Reset button styles and set the correct one
          document.querySelectorAll(".btn-type-toggle").forEach((b) => {
            b.style.background = "none";
            b.style.color = "var(--text-muted)";
            b.style.borderColor = "var(--border)";
            if (b.dataset.type === (node.type || "")) {
              b.style.background = node.type === "income" ? "#f0fdf4" : "#fef2f2";
              b.style.color = node.type === "income" ? "#16a34a" : "#dc2626";
              b.style.borderColor = node.type === "income" ? "#86efac" : "#fca5a5";
            }
          });
        } else {
          document.getElementById("category-type-group").style.display = "none";
        }
        document.getElementById("category-parent-group").style.display = "none";
        document.getElementById("category-submit").textContent = "Сохранить";
        openOverlay("category-modal");
        document.getElementById("category-name").focus();
      }

      function openCopyArticle(article) {
        editingNodeId = null;
        editingNodeParent = article.parent_id;
        document.getElementById("category-modal-title").textContent =
          "Копировать статью";
        document.getElementById("category-name").value = "Копия — " + article.name;
        document.getElementById("category-err-name").textContent = "";
        document.getElementById("category-err-global").textContent = "";
        document.getElementById("category-type-group").style.display = "none";
        document.getElementById("category-parent-group").style.display = "none";
        document.getElementById("category-submit").textContent = "Создать копию";
        openOverlay("category-modal");
        document.getElementById("category-name").focus();
      }

      function openAddChild(parentNode) {
        editingNodeId = null;
        editingNodeParent = parentNode.id;
        const nextLevel = parentNode.level - 1;
        const levelLabels = { 3: "группу", 2: "статью" };
        document.getElementById("category-modal-title").textContent =
          "Добавить " + levelLabels[nextLevel] + " к " + escHtml(parentNode.name);
        document.getElementById("category-name").value = "";
        document.getElementById("category-name").placeholder =
          nextLevel === 3 ? "Например: Выручка" : "Например: Продажи товаров";
        document.getElementById("category-err-name").textContent = "";
        document.getElementById("category-err-global").textContent = "";

        if (nextLevel === 3) {
          // Adding group
          document.getElementById("category-type-group").style.display = "block";
          document.getElementById("category-type").value = "";
          // Reset button styles
          document.querySelectorAll(".btn-type-toggle").forEach((b) => {
            b.style.background = "none";
            b.style.color = "var(--text-muted)";
            b.style.borderColor = "var(--border)";
          });
          document.getElementById("category-parent-group").style.display = "none";
        } else if (nextLevel === 2) {
          // Adding article
          document.getElementById("category-type-group").style.display = "none";
          document.getElementById("category-parent-group").style.display = "block";
          const groups = allCategories.filter((c) => c.level === 3);
          populateSelect(
            document.getElementById("category-parent"),
            groups,
            (g) => g.id,
            (g) => g.name + (g.type ? ` (${g.type === "income" ? "Доходы" : "Расходы"})` : ""),
          );
          document.getElementById("category-parent").value = "";
        }
        document.getElementById("category-submit").textContent = "Добавить";
        openOverlay("category-modal");
        document.getElementById("category-name").focus();
      }

      document
        .getElementById("add-activity-btn")
        .addEventListener("click", openAddActivity);

      document
        .getElementById("add-group-root-btn")
        .addEventListener("click", () => {
          editingNodeId = null;
          editingNodeParent = null;
          document.getElementById("category-modal-title").textContent =
            "Добавить группу";
          document.getElementById("category-name").value = "";
          document.getElementById("category-name").placeholder =
            "Например: Выручка";
          document.getElementById("category-err-name").textContent = "";
          document.getElementById("category-err-global").textContent = "";
          document.getElementById("category-type-group").style.display = "block";
          // Reset button styles
          document.querySelectorAll(".btn-type-toggle").forEach((b) => {
            b.style.background = "none";
            b.style.color = "var(--text-muted)";
            b.style.borderColor = "var(--border)";
          });
          document.getElementById("category-type").value = "";
          document.getElementById("category-parent-group").style.display = "block";
          const activities = allCategories.filter((c) => c.level === 4);
          populateSelect(
            document.getElementById("category-parent"),
            activities,
            (a) => a.id,
            (a) => a.name,
          );
          document.getElementById("category-parent").value = "";
          document.getElementById("category-submit").textContent = "Добавить";
          openOverlay("category-modal");
          document.getElementById("category-name").focus();
        });

      document
        .getElementById("category-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const name = document.getElementById("category-name").value.trim();
          const type = document.getElementById("category-type").value || null;
          const parentVal = document.getElementById("category-parent").value;
          const parentId = parentVal ? Number(parentVal) : editingNodeParent;
          const errName = document.getElementById("category-err-name");
          const errParent = document.getElementById("category-err-parent");
          const errGlobal = document.getElementById("category-err-global");
          const btn = document.getElementById("category-submit");

          errName.textContent = "";
          errParent.textContent = "";
          errGlobal.textContent = "";

          if (!name) {
            errName.textContent = "Введите название";
            return;
          }

          btn.disabled = true;
          btn.textContent = "Сохранение…";
          try {
            if (editingNodeId !== null) {
              // Edit
              await apiFetch(`/categories/${editingNodeId}`, {
                method: "PUT",
                body: JSON.stringify({ name, type }),
              });
            } else {
              // Create
              let level;
              if (editingNodeParent === null) {
                // New activity
                level = 4;
              } else {
                // Find parent and determine level
                const parent = allCategories.find(
                  (c) => c.id === editingNodeParent,
                );
                level = parent ? parent.level - 1 : 3;
              }
              await apiFetch("/categories", {
                method: "POST",
                body: JSON.stringify({
                  name,
                  level,
                  type: level < 4 ? type : null,
                  parent_id: editingNodeParent,
                  sort_order: allCategories
                    .filter(c => (c.parent_id ?? null) === (editingNodeParent ?? null) && c.level === level)
                    .reduce((m, c) => Math.max(m, c.sort_order ?? 0), -10) + 10,
                }),
              });
            }
            closeOverlay("category-modal");
            await reload();
          } catch (err) {
            errGlobal.textContent = err.message;
          } finally {
            btn.disabled = false;
            btn.textContent = editingNodeId ? "Сохранить" : "Добавить";
          }
        });

      // ── Confirm delete ──────────────────────────────────
      let pendingDeleteId = null;

      function openConfirm(id, name) {
        pendingDeleteId = id;
        document.getElementById("confirm-title").textContent = "Удалить?";
        document.getElementById("confirm-text").textContent =
          `«${escHtml(name)}» будет удалён. Если есть подкатегории — удалите их сначала.`;
        openOverlay("confirm-overlay");
      }

      document
        .getElementById("confirm-cancel")
        .addEventListener("click", () => closeOverlay("confirm-overlay"));
      document
        .getElementById("confirm-overlay")
        .addEventListener("click", (e) => {
          if (e.target === e.currentTarget) closeOverlay("confirm-overlay");
        });

      document
        .getElementById("confirm-ok")
        .addEventListener("click", async () => {
          if (!pendingDeleteId) return;
          const id = pendingDeleteId;
          closeOverlay("confirm-overlay");
          try {
            await apiFetch(`/categories/${id}`, { method: "DELETE" });
            await reload();
          } catch (err) {
            alert("Ошибка удаления: " + err.message);
          }
          pendingDeleteId = null;
        });

      // ── Keyboard ────────────────────────────────────────
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        ["confirm-overlay", "category-modal"].forEach((id) => {
          if (document.getElementById(id).classList.contains("open"))
            closeOverlay(id);
        });
      });

      // ── Init ─────────────────────────────────────────────
      (async () => {
        try {
          await loadAll();
          renderActivitiesReference();
          renderMainTree();
        } catch (err) {
          document.getElementById("activities-tbody").innerHTML =
            `<tr><td colspan="2" class="state-error">Ошибка загрузки: ${escHtml(err.message)}</td></tr>`;
          document.getElementById("main-tree").innerHTML =
            `<div class="state-error">Ошибка загрузки: ${escHtml(err.message)}</div>`;
        }
      })();
    </script>
  </body>
</html>
