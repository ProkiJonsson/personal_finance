<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Фонды</title>
    <link rel="stylesheet" href="css/sidebar.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #1a6dff;
            --primary-dark: #1558d6;
            --primary-light: #eff4ff;
            --bg-body: #f5f7fb;
            --bg-card-light: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --success: #16a34a;
            --danger: #dc2626;

            --header-h: 64px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */

        /* Header */
        .header {
            height: var(--header-h);
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-nav-item {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .header-nav-item:hover { background: var(--primary-light); color: var(--primary); }
        .header-nav-item.active { color: var(--primary); background: var(--primary-light); }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon-btn {
            width: 40px; height: 40px;
            border: none; background: transparent;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .header-icon-btn:hover { background: var(--primary-light); color: var(--primary); }
        .header-icon-btn svg { width: 20px; height: 20px; }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--bg-body);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-menu:hover { background: var(--primary-light); }

        .user-avatar {
            width: 32px; height: 32px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600; color: #fff;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Page */
        .main-content {
            margin-left: var(--sidebar-w);
            flex: 1;
            min-width: 0;
        }

        body.sidebar-expanded .main-content {
            margin-left: var(--sidebar-w-expanded);
            transition: margin-left 0.3s ease;
        }

        .page {
            padding: 32px;
            max-width: 1400px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Buttons */
        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 109, 255, 0.3);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn svg { width: 18px; height: 18px; }

        /* Funds Grid */
        .funds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .fund-card {
            background: var(--bg-card-light);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .fund-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            border-color: var(--primary);
        }

        .fund-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .fund-icon {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fund-icon svg { width: 24px; height: 24px; }

        .fund-actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .fund-card:hover .fund-actions { opacity: 1; }

        .fund-action-btn {
            width: 32px; height: 32px;
            border: none;
            background: var(--bg-body);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .fund-action-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .fund-action-btn.delete:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .fund-action-btn svg { width: 14px; height: 14px; }

        .fund-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-current { background: #eff4ff; color: var(--primary); }
        .badge-investment { background: #f0fdf4; color: var(--success); }

        .fund-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .fund-balance {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .fund-currency {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Add Fund Card */
        .fund-card-add {
            background: var(--bg-card-light);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-secondary);
            min-height: 200px;
        }

        .fund-card-add:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .fund-card-add .add-icon {
            width: 56px; height: 56px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fund-card-add .add-icon svg {
            width: 28px; height: 28px;
            color: var(--primary);
        }

        .fund-card-add span {
            font-size: 14px;
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 64px; height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            to { background-position: -200% 0; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px; height: 36px;
            border: none; background: transparent;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .modal-close:hover { background: var(--bg-body); color: var(--text-primary); }
        .modal-close svg { width: 18px; height: 18px; }

        .modal-body { padding: 24px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fafafa;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-error {
            font-size: 12px;
            color: var(--danger);
            min-height: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }

        /* Confirm Modal */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .confirm-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .confirm-box {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            text-align: center;
        }

        .confirm-box h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .confirm-footer {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content { margin-left: 0; margin-bottom: 70px; }

            .header { padding: 0 16px; }
            .header-nav { display: none; }
            .page { padding: 16px; }
            .funds-grid { grid-template-columns: 1fr; }
        }

    </style>
</head>

<script>
const API = 'http://127.0.0.1:8000';

// Auth guard
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// Decode JWT
function parseJwt(t) {
    try {
        const payload = t.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
    } catch { return {}; }
}

const jwt = parseJwt(token);
const displayName = jwt.name || jwt.email || 'Пользователь';
document.getElementById('user-name').textContent = displayName;
document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

// Logout
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}
document.getElementById('logout-btn').addEventListener('click', logout);

// API fetch
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// Formatters
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// Fund colors
const FUND_COLORS = [
    { bg: '#eff4ff', color: '#1a6dff' },
    { bg: '#f0fdf4', color: '#16a34a' },
    { bg: '#fff7ed', color: '#ea580c' },
    { bg: '#fdf4ff', color: '#9333ea' },
    { bg: '#fef2f2', color: '#dc2626' },
];

const TYPE_LABELS = { current: 'Текущий', investment: 'Инвестиционный' };
const TYPE_BADGES = { current: 'badge-current', investment: 'badge-investment' };

// Render funds
function renderFunds(funds) {
    const grid = document.getElementById('funds-grid');
    grid.innerHTML = '';

    if (!funds.length) {
        grid.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                <h3>Фондов пока нет</h3>
                <p>Добавьте первый фонд, чтобы начать учёт</p>
            </div>
        `;
        return;
    }

    funds.forEach((fund, i) => {
        const c = FUND_COLORS[i % FUND_COLORS.length];
        const card = document.createElement('div');
        card.className = 'fund-card';
        card.innerHTML = `
            <div class="fund-card-header">
                <div class="fund-icon" style="background: ${c.bg}">
                    <svg viewBox="0 0 24 24" fill="${c.color}">
                        <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
                    </svg>
                </div>
                <div class="fund-actions">
                    <button class="fund-action-btn" onclick="editFund(${fund.id})" aria-label="Редактировать">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                    </button>
                    <button class="fund-action-btn delete" onclick="deleteFund(${fund.id})" aria-label="Удалить">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            </div>
            <span class="fund-badge ${TYPE_BADGES[fund.type]}">${TYPE_LABELS[fund.type]}</span>
            <h3 class="fund-name">${escHtml(fund.name)}</h3>
            <div class="fund-balance">${fmt(fund.balance || 0)}</div>
            <div class="fund-currency">RUB</div>
        `;
        grid.appendChild(card);
    });

    // Add card
    const addCard = document.createElement('div');
    addCard.className = 'fund-card fund-card-add';
    addCard.innerHTML = `
        <div class="add-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12h14"/>
            </svg>
        </div>
        <span>Добавить фонд</span>
    `;
    addCard.addEventListener('click', () => openModal());
    grid.appendChild(addCard);
}

// Modal handling
const modal = document.getElementById('fund-modal');
let editingId = null;

function openModal(edit = false) {
    editingId = edit ? null : null;
    document.getElementById('modal-title').textContent = edit ? 'Редактировать фонд' : 'Добавить фонд';
    document.getElementById('fund-name').value = '';
    document.getElementById('fund-type').value = 'current';
    document.getElementById('err-name').textContent = '';
    document.getElementById('err-type').textContent = '';
    document.getElementById('err-global').textContent = '';
    modal.classList.add('open');
}

function closeModal() {
    modal.classList.remove('open');
    editingId = null;
}

document.getElementById('add-fund-btn').addEventListener('click', () => openModal());
document.getElementById('add-btn').addEventListener('click', () => openModal());
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
});

// Form submit
document.getElementById('fund-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('fund-name').value.trim();
    const type = document.getElementById('fund-type').value;

    if (!name) {
        document.getElementById('err-name').textContent = 'Введите название';
        return;
    }

    try {
        if (editingId) {
            await apiFetch(`/funds/${editingId}`, {
                method: 'PUT',
                body: JSON.stringify({ name, type }),
            });
        } else {
            await apiFetch('/funds', {
                method: 'POST',
                body: JSON.stringify({ name, type }),
            });
        }
        closeModal();
        loadFunds();
    } catch (err) {
        document.getElementById('err-global').textContent = err.message;
    }
});

// Delete confirmation
const confirmModal = document.getElementById('confirm-modal');
let deleteId = null;

function showConfirm(id) {
    deleteId = id;
    confirmModal.classList.add('open');
}

function hideConfirm() {
    confirmModal.classList.remove('open');
    deleteId = null;
}

document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) hideConfirm();
});

document.getElementById('confirm-ok').addEventListener('click', async () => {
    if (!deleteId) return;
    try {
        await apiFetch(`/funds/${deleteId}`, { method: 'DELETE' });
        hideConfirm();
        loadFunds();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
});

// Load funds
async function loadFunds() {
    const grid = document.getElementById('funds-grid');
    try {
        const funds = await apiFetch('/funds');
        renderFunds(funds);
    } catch (err) {
        grid.innerHTML = '<div class="empty-state"><h3>Ошибка загрузки</h3></div>';
    }
}

// Placeholder functions
function editFund(id) {
    console.log('Edit fund:', id);
    // TODO: Load fund data and open modal
}

function deleteFund(id) {
    showConfirm(id);
}

// Init
loadFunds();
</script>
