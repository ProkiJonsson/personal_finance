<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Фонды</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue:       #1a6dff;
            --blue-dark:  #1558d6;
            --blue-light: #eff4ff;
            --sidebar-w:  240px;
            --header-h:   64px;
            --text:       #111827;
            --text-muted: #6b7280;
            --border:     #e5e7eb;
            --bg:         #f5f7fb;
            --white:      #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Sidebar ─────────────────────────────────── */
        .sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 50;
        }

        .sidebar-logo {
            height: var(--header-h);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-logo-icon {
            width: 34px; height: 34px;
            background: var(--blue);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-logo-icon svg { width: 18px; height: 18px; fill: #fff; }

        .sidebar-logo span {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 10px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover { background: var(--blue-light); color: var(--blue); }

        .nav-item.active {
            background: var(--blue-light);
            color: var(--blue);
            font-weight: 600;
        }

        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }

        .nav-section {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.07em;
            color: #9ca3af;
            text-transform: uppercase;
            padding: 16px 12px 6px;
        }

        .sidebar-bottom {
            padding: 10px;
            border-top: 1px solid var(--border);
        }

        /* ── Header ──────────────────────────────────── */
        .header {
            position: fixed;
            top: 0;
            left: var(--sidebar-w);
            right: 0;
            height: var(--header-h);
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 28px;
            gap: 14px;
            z-index: 40;
        }

        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .header-spacer { flex: 1; }

        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 34px; height: 34px;
            background: var(--blue-light);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: var(--blue);
            flex-shrink: 0;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        .user-name:hover { color: var(--blue); }

        .btn-logout {
            padding: 7px 16px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-logout:hover { border-color: #ef4444; color: #ef4444; }

        /* ── Main content ─────────────────────────────── */
        .content {
            margin-left: var(--sidebar-w);
            padding-top: var(--header-h);
            min-height: 100vh;
        }

        .page {
            padding: 28px 28px 40px;
            max-width: 1100px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        /* ── Buttons ──────────────────────────────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--blue-dark); }

        .btn-primary svg { width: 16px; height: 16px; fill: #fff; }

        .btn-icon {
            width: 32px; height: 32px;
            border-radius: 7px;
            border: 1.5px solid var(--border);
            background: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s, border-color 0.15s;
        }

        .btn-icon svg { width: 15px; height: 15px; }

        .btn-icon-edit { color: var(--text-muted); }
        .btn-icon-edit:hover { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }

        .btn-icon-del { color: var(--text-muted); }
        .btn-icon-del:hover { background: #fef2f2; border-color: #fca5a5; color: #dc2626; }

        .btn-icon-copy { color: var(--text-muted); }
        .btn-icon-copy:hover { background: #f0fdf4; border-color: #86efac; color: #16a34a; }

        /* ── Funds grid ───────────────────────────────── */
        .funds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .fund-card {
            background: var(--white);
            border-radius: 14px;
            padding: 20px 20px 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: box-shadow 0.2s;
        }

        .fund-card:hover { box-shadow: 0 4px 16px rgba(26,109,255,0.10); }

        .fund-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
        }

        .fund-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        .fund-icon svg { width: 18px; height: 18px; }

        .fund-card-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .fund-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .fund-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .fund-type {
            font-size: 12px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            align-self: flex-start;
        }

        .type-current    { background: #eff4ff; color: #1a6dff; }
        .type-investment { background: #f0fdf4; color: #16a34a; }

        .fund-balance {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .fund-currency {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -6px;
        }

        /* ── States ───────────────────────────────────── */
        .state-empty {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .state-error {
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
            color: #dc2626;
            font-size: 14px;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer { to { background-position: -200% 0; } }

        .skeleton-card {
            height: 160px;
            border-radius: 14px;
        }

        /* ── Modal overlay ────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            transform: translateY(12px);
            transition: transform 0.2s;
        }

        .modal-overlay.open .modal { transform: translateY(0); }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-close {
            width: 30px; height: 30px;
            border: none;
            background: none;
            cursor: pointer;
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            transition: background 0.15s;
        }

        .modal-close:hover { background: #f3f4f6; }
        .modal-close svg { width: 16px; height: 16px; fill: currentColor; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            padding: 10px 13px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            font-size: 14px;
            color: var(--text);
            background: var(--white);
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--blue);
        }

        .form-error {
            font-size: 12px;
            color: #dc2626;
            min-height: 16px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .btn-secondary {
            padding: 9px 18px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            background: none;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
            font-family: inherit;
        }

        .btn-secondary:hover { border-color: #9ca3af; color: var(--text); }

        /* ── Confirm dialog ───────────────────────────── */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .confirm-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .confirm-box {
            background: var(--white);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.18);
            transform: translateY(12px);
            transition: transform 0.2s;
        }

        .confirm-overlay.open .confirm-box { transform: translateY(0); }

        .confirm-box h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .confirm-box p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 22px;
            line-height: 1.5;
        }

        .confirm-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-danger {
            padding: 9px 18px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }

        .btn-danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

            <span class="modal-title" id="modal-title">Добавить фонд</span>

<script>
const API = 'http://127.0.0.1:8000';

// ── Auth guard ──────────────────────────────────────
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// ── Decode JWT payload (no verification — display only) ──
function parseJwt(t) {
    try {
        const payload = t.split('.')[1];
        const json = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
        return JSON.parse(json);
    } catch { return {}; }
}

const jwt = parseJwt(token);
const displayName = jwt.name || jwt.email || 'Пользователь';
document.getElementById('user-name').textContent = displayName;
document.getElementById('user-avatar').textContent = displayName.charAt(0).toUpperCase();

// ── Logout ──────────────────────────────────────────
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}
document.getElementById('logout-btn').addEventListener('click', logout);
document.getElementById('header-logout-btn').addEventListener('click', logout);

// ── API helpers ─────────────────────────────────────
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// ── Formatters ──────────────────────────────────────
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

const TYPE_LABELS = { current: 'Текущий', investment: 'Инвестиционный' };
const TYPE_CSS    = { current: 'type-current', investment: 'type-investment' };

const FUND_COLORS = [
    { bg: '#eff4ff', color: '#1a6dff' },
    { bg: '#f0fdf4', color: '#16a34a' },
    { bg: '#fff7ed', color: '#ea580c' },
    { bg: '#fdf4ff', color: '#9333ea' },
    { bg: '#fef2f2', color: '#dc2626' },
];

// ── Render funds ────────────────────────────────────
function renderFunds(funds) {
    const grid = document.getElementById('funds-grid');
    grid.innerHTML = '';

    if (!funds.length) {
        grid.innerHTML = '<div class="state-empty">Фондов пока нет. Добавьте первый фонд.</div>';
        return;
    }

    funds.forEach((fund, i) => {
        const c = FUND_COLORS[i % FUND_COLORS.length];
        const typeLabel = TYPE_LABELS[fund.type] ?? fund.type;
        const typeCss   = TYPE_CSS[fund.type] ?? '';

        const card = document.createElement('div');
        card.className = 'fund-card';
        card.innerHTML = `
            <div class="fund-card-top">
                <div class="fund-icon" style="background:${c.bg}">
                    <svg viewBox="0 0 24 24" fill="${c.color}"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                </div>
                <div class="fund-card-actions">
                    <button class="btn-icon btn-icon-copy" title="Копировать" data-id="${fund.id}">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    </button>
                    <button class="btn-icon btn-icon-edit" title="Редактировать" data-id="${fund.id}">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </button>
                    <button class="btn-icon btn-icon-del" title="Удалить" data-id="${fund.id}" data-name="${escHtml(fund.name)}">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>
            </div>
            <div class="fund-name">${escHtml(fund.name)}</div>
            <span class="fund-type ${typeCss}">${escHtml(typeLabel)}</span>
            <div class="fund-balance">${fmt(fund.balance ?? 0, fund.currency || 'RUB')}</div>
        `;
        grid.appendChild(card);
    });

    // Copy buttons
    grid.querySelectorAll('.btn-icon-copy').forEach(btn => {
        btn.addEventListener('click', () => {
            const fund = funds.find(f => String(f.id) === btn.dataset.id);
            if (fund) openCopyModal(fund);
        });
    });

    // Edit buttons
    grid.querySelectorAll('.btn-icon-edit').forEach(btn => {
        btn.addEventListener('click', () => {
            const fund = funds.find(f => String(f.id) === btn.dataset.id);
            if (fund) openEditModal(fund);
        });
    });

    // Delete buttons
    grid.querySelectorAll('.btn-icon-del').forEach(btn => {
        btn.addEventListener('click', () => {
            openConfirm(btn.dataset.id, btn.dataset.name);
        });
    });
}

// ── Load funds ──────────────────────────────────────
async function loadFunds() {
    const grid = document.getElementById('funds-grid');
    try {
        const funds = await apiFetch('/funds');
        renderFunds(funds);
    } catch (err) {
        grid.innerHTML = `<div class="state-error">Ошибка загрузки фондов: ${escHtml(err.message)}</div>`;
    }
}

// ── Modal state ─────────────────────────────────────
let editingId = null;

const overlay    = document.getElementById('fund-modal-overlay');
const modalTitle = document.getElementById('modal-title');
const submitBtn  = document.getElementById('modal-submit-btn');
const fieldName  = document.getElementById('field-name');
const fieldType  = document.getElementById('field-type');
const errName    = document.getElementById('err-name');
const errType    = document.getElementById('err-type');
const errGlobal  = document.getElementById('err-global');

function openModal(title, submitLabel) {
    modalTitle.textContent = title;
    submitBtn.textContent  = submitLabel;
    errName.textContent = '';
    errType.textContent = '';
    errGlobal.textContent = '';
    overlay.classList.add('open');
    fieldName.focus();
}

function closeModal() {
    overlay.classList.remove('open');
    editingId = null;
    document.getElementById('fund-form').reset();
}

function openAddModal() {
    editingId = null;
    fieldName.value = '';
    fieldType.value = 'current';
    openModal('Добавить фонд', 'Добавить');
}

function openEditModal(fund) {
    editingId = fund.id;
    fieldName.value = fund.name;
    fieldType.value = fund.type || 'current';
    openModal('Редактировать фонд', 'Сохранить');
}

function openCopyModal(fund) {
    editingId = null;
    fieldName.value = 'Копия — ' + fund.name;
    fieldType.value = fund.type || 'current';
    openModal('Копировать фонд', 'Создать копию');
}

document.getElementById('add-fund-btn').addEventListener('click', openAddModal);
document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

// ── Form submit ─────────────────────────────────────
document.getElementById('fund-form').addEventListener('submit', async e => {
    e.preventDefault();

    errName.textContent = '';
    errGlobal.textContent = '';

    const name = fieldName.value.trim();
    const type = fieldType.value;

    if (!name) {
        errName.textContent = 'Введите название фонда';
        fieldName.focus();
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Сохранение…';

    try {
        if (editingId !== null) {
            await apiFetch(`/funds/${editingId}`, {
                method: 'PUT',
                body: JSON.stringify({ name, type }),
            });
        } else {
            await apiFetch('/funds', {
                method: 'POST',
                body: JSON.stringify({ name, type }),
            });
        }
        closeModal();
        loadFunds();
    } catch (err) {
        errGlobal.textContent = err.message || 'Произошла ошибка';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = editingId !== null ? 'Сохранить' : 'Добавить';
    }
});

// ── Confirm dialog ──────────────────────────────────
let pendingDeleteId = null;

const confirmOverlay = document.getElementById('confirm-overlay');
const confirmText    = document.getElementById('confirm-text');

function openConfirm(id, name) {
    pendingDeleteId = id;
    confirmText.textContent = `Фонд «${name}» будет удалён. Это действие нельзя отменить.`;
    confirmOverlay.classList.add('open');
}

function closeConfirm() {
    confirmOverlay.classList.remove('open');
    pendingDeleteId = null;
}

document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirm);
confirmOverlay.addEventListener('click', e => { if (e.target === confirmOverlay) closeConfirm(); });

document.getElementById('confirm-ok-btn').addEventListener('click', async () => {
    if (!pendingDeleteId) return;
    const id = pendingDeleteId;
    closeConfirm();
    try {
        await apiFetch(`/funds/${id}`, { method: 'DELETE' });
        loadFunds();
    } catch (err) {
        alert('Ошибка удаления: ' + err.message);
    }
});

// ── Keyboard close ──────────────────────────────────
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (confirmOverlay.classList.contains('open')) closeConfirm();
        else if (overlay.classList.contains('open')) closeModal();
    }
});

// ── Init ─────────────────────────────────────────────
loadFunds();
</script>
</body>
</html>
