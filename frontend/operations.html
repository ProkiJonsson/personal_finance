<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Операции</title>
    <style id="sidebar-init-style">.main-content{opacity:0!important;transition:none!important}.sidebar{transition:none!important}</style>
    <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* ========== PAGE CONTENT ========== */
        .page {
            padding: 32px;
            max-width: 1400px;
        }

        /* Accounts Row */
        .accounts-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
        }

        .accounts-row::-webkit-scrollbar {
            height: 6px;
        }

        .accounts-row::-webkit-scrollbar-track {
            background: var(--bg-body);
            border-radius: 3px;
        }

        .accounts-row::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .account-card {
            flex-shrink: 0;
            min-width: 200px;
            background: var(--bg-card-light);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .account-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .account-card.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .account-card-dark {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
        }

        .account-card-dark .account-name {
            color: var(--text-muted);
        }

        .account-card-dark .account-change {
            color: var(--success);
        }

        .account-card-dark .account-balance {
            color: #fff;
        }

        .account-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .account-change {
            font-size: 12px;
            font-weight: 600;
            color: var(--success);
            margin-bottom: 4px;
        }

        .account-balance {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .account-card-add {
            background: var(--bg-card-light);
            border: 2px dashed var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .account-card-add:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: none;
            box-shadow: none;
        }

        .account-card-add .add-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .account-card-add .add-icon svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }

        .account-card-add span {
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        /* Table Container */
        .table-container {
            background: var(--bg-card-light);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 16px;
        }

        .table-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .table-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(26, 109, 255, 0.3);
        }

        .btn-secondary {
            background: #fff;
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn svg {
            width: 16px;
            height: 16px;
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            background: var(--bg-body);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: #fff;
            border-color: var(--text-primary);
        }

        .quick-dates {
            display: flex;
            gap: 4px;
        }

        .quick-date-btn {
            padding: 6px 12px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-date-btn:hover,
        .quick-date-btn.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .date-range {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
        }

        .date-range input {
            border: none;
            outline: none;
            font-size: 14px;
            color: var(--text-primary);
            background: transparent;
        }

        .search-filter {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-filter input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fff;
            outline: none;
            transition: all 0.2s;
        }

        .search-filter input:focus {
            border-color: var(--primary);
        }

        .search-filter svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        /* Extra Filters */
        .extra-filters {
            display: none;
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .extra-filters.open {
            display: flex;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-field input,
        .filter-field select {
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fff;
            outline: none;
            transition: all 0.2s;
            min-width: 140px;
        }

        .filter-field input:focus,
        .filter-field select:focus {
            border-color: var(--primary);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            background: #fafafa;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        thead th:hover {
            color: var(--text-primary);
        }

        thead th .sort-icon {
            display: inline-block;
            margin-left: 4px;
            opacity: 0.4;
        }

        thead th.sorted .sort-icon {
            opacity: 1;
            color: var(--primary);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--primary-light);
        }

        tbody tr.selected-row {
            background: var(--primary-light);
        }

        tbody td {
            padding: 16px 20px;
            color: var(--text-primary);
            vertical-align: middle;
        }

        .td-check {
            width: 40px;
            text-align: center;
        }

        .td-check input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .td-num {
            color: var(--text-muted);
            font-size: 13px;
            width: 50px;
        }

        .td-date {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        .td-desc {
            font-weight: 500;
            max-width: 250px;
        }

        .td-account {
            color: var(--text-secondary);
        }

        .td-category span {
            padding: 4px 12px;
            background: var(--bg-body);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .td-type span {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-income {
            background: #f0fdf4;
            color: var(--success);
        }

        .type-expense {
            background: #fef2f2;
            color: var(--danger);
        }

        .td-amount {
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }

        .amount-income {
            color: var(--success);
        }

        .amount-expense {
            color: var(--danger);
        }

        .td-comment {
            color: var(--text-secondary);
            font-size: 13px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .td-actions {
            text-align: right;
            white-space: nowrap;
        }

        .action-btns {
            display: flex;
            gap: 4px;
            justify-content: flex-end;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-body);
            color: var(--primary);
        }

        .action-btn.delete:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Table Footer */
        .table-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            background: #fafafa;
        }

        .table-total {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .pagination {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pagination button {
            width: 36px;
            height: 36px;
            border: 1.5px solid var(--border);
            background: #fff;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .pagination button:hover,
        .pagination button.active {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .pagination button.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: #fff;
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-body);
            color: var(--text-primary);
        }

        .modal-close svg {
            width: 18px;
            height: 18px;
        }

        .modal-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-primary);
            background: #fafafa;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .type-segmented {
            display: flex;
            background: var(--bg-body);
            border-radius: 12px;
            padding: 4px;
        }

        .type-segmented button {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .type-segmented button.active-income {
            background: #f0fdf4;
            color: var(--success);
        }

        .type-segmented button.active-expense {
            background: #fef2f2;
            color: var(--danger);
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                bottom: 0;
                top: auto;
                flex-direction: row;
                padding: 12px;
                border-right: none;
                border-top: 1px solid var(--border);
            }

            .main-content {
                margin-left: 0;
                margin-bottom: 70px;
            }

            .header {
                padding: 0 16px;
            }

            .header-nav {
                display: none;
            }

            .page {
                padding: 16px;
            }
        }

    </style>
</head>
<body>

<!-- Main Content -->
<main class="main-content">
    <!-- Header и sidebar инъектируются через layout.js -->

    <!-- Page Content -->
    <div class="page">
        <!-- Accounts Row -->
        <div class="accounts-row" id="accounts-container">
            <!-- Skeleton -->
            <div class="account-card account-card-dark selected skeleton" style="height: 100px;"></div>
            <div class="account-card skeleton" style="height: 100px;"></div>
            <div class="account-card skeleton" style="height: 100px;"></div>
            <div class="account-card account-card-add">
                <div class="add-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </div>
                <span>Добавить счёт</span>
            </div>
        </div>

        <!-- Table Container -->
        <div class="table-container">
            <div class="table-header">
                <h3 class="table-title">Все операции</h3>
                <div class="table-actions">
                    <button class="btn btn-secondary" id="export-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Экспорт
                    </button>
                    <button class="btn btn-secondary" id="toggle-filters-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="21" x2="4" y2="14"/>
                            <line x1="4" y1="10" x2="4" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12" y2="3"/>
                            <line x1="20" y1="21" x2="20" y2="16"/>
                            <line x1="20" y1="12" x2="20" y2="3"/>
                            <line x1="1" y1="14" x2="7" y2="14"/>
                            <line x1="9" y1="8" x2="15" y2="8"/>
                            <line x1="17" y1="16" x2="23" y2="16"/>
                        </svg>
                        Фильтры
                    </button>
                    <button class="btn btn-primary" id="add-operation-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                        Добавить
                    </button>
                </div>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-group">
                    <button class="filter-btn active" data-type="all">Все</button>
                    <button class="filter-btn" data-type="income">Приход</button>
                    <button class="filter-btn" data-type="expense">Расход</button>
                </div>
                <div class="quick-dates">
                    <button class="quick-date-btn" data-q="yesterday">Вчера</button>
                    <button class="quick-date-btn" data-q="today">Сегодня</button>
                    <button class="quick-date-btn" data-q="week">Неделя</button>
                    <button class="quick-date-btn" data-q="month">Месяц</button>
                </div>
                <div class="date-range">
                    <input type="date" id="date-from">
                    <span style="color: var(--text-muted);">—</span>
                    <input type="date" id="date-to">
                </div>
                <div class="search-filter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск по операциям...">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" id="search-btn">Найти</button>
                    <button class="btn btn-secondary" id="reset-filters-btn">Сбросить</button>
                </div>
            </div>

            <!-- Extra Filters -->
            <div class="extra-filters" id="extra-filters">
                <div class="filter-field">
                    <label>Сумма от</label>
                    <input type="number" id="amount-min" placeholder="0" min="0">
                </div>
                <div class="filter-field">
                    <label>Сумма до</label>
                    <input type="number" id="amount-max" placeholder="∞" min="0">
                </div>
                <div class="filter-field">
                    <label>Фонд</label>
                    <select id="filter-fund">
                        <option value="">Все фонды</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Категория</label>
                    <select id="filter-category">
                        <option value="">Все категории</option>
                    </select>
                </div>
                <button class="btn btn-secondary" id="clear-filters-btn" style="align-self: flex-end;">Сбросить</button>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th class="td-check"><input type="checkbox" id="select-all"></th>
                            <th>№</th>
                            <th>Дата</th>
                            <th>Описание</th>
                            <th>Счёт</th>
                            <th>Категория</th>
                            <th>Тип</th>
                            <th style="text-align: right;">Сумма</th>

            <h3 class="modal-title" id="modal-title">Добавить операцию</h3>
            <button class="modal-close" id="modal-close">

                    <line x1="18" y1="6" x2="6" y2="18"/>

            </button>
        </div>

            <div class="type-segmented">
                <button type="button" class="active-expense" data-type="expense">Расход</button>

            </div>

                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="tx-date" required>
                </div>
                <div class="form-group">

                    <input type="number" id="tx-amount" placeholder="0 ₽" min="0" step="0.01" required>

                    </select>
                </div>

                    <label>Категория</label>

                        <option value="">Выбрать категорию</option>

                <label>Описание</label>
                <input type="text" id="tx-description" placeholder="Оплата...">
            </div>

            </div>

            <button class="btn btn-primary" id="modal-save">Сохранить</button>

<script>
const API = 'http://127.0.0.1:8000';

// Auth guard
const token = localStorage.getItem('token') || sessionStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

// Logout (используется в apiFetch при 401)
function logout() {
    localStorage.removeItem('token');
    sessionStorage.removeItem('token');
    window.location.href = 'index.html';
}

// API fetch
async function apiFetch(path, options = {}) {
    const res = await fetch(API + path, {
        ...options,
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            ...(options.headers || {}),
        },
    });
    if (res.status === 401) { logout(); }
    if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || 'HTTP ' + res.status);
    }
    if (res.status === 204) return null;
    return res.json();
}

// Formatters
function fmt(amount, currency = 'RUB') {
    return new Intl.NumberFormat('ru-RU', {
        style: 'currency', currency,
        minimumFractionDigits: 2, maximumFractionDigits: 2,
    }).format(amount);
}

function fmtDate(iso) {
    return new Date(iso).toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit',
    });
}

function escHtml(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// State
let selectedAccount = 'all';
let filterType = 'all';
let transactions = [];
let accounts = [];
let funds = [];

// Load accounts
async function loadAccounts() {
    const container = document.getElementById('accounts-container');
    try {
        const [accs, fds] = await Promise.all([
            apiFetch('/accounts'),
            apiFetch('/funds')
        ]);
        accounts = accs;
        funds = fds;
        container.innerHTML = '';

        const totalBalance = (accs.reduce((s, a) => s + a.balance, 0) + 
                             fds.reduce((s, f) => s + (f.balance || 0), 0));

        // All accounts card
        const allCard = document.createElement('div');
        allCard.className = 'account-card account-card-dark selected';
        allCard.innerHTML = `
            <div class="account-name">Все счета</div>
            <div class="account-balance">${fmt(totalBalance)}</div>
        `;
        allCard.addEventListener('click', () => selectAccount('all', allCard));
        container.appendChild(allCard);

        // Individual accounts
        accounts.forEach(acc => {
            const card = document.createElement('div');
            card.className = 'account-card';
            card.innerHTML = `
                <div class="account-name">${escHtml(acc.name)}</div>
                <div class="account-balance">${fmt(acc.balance)}</div>
            `;
            card.addEventListener('click', () => selectAccount(acc.id, card));
            container.appendChild(card);
        });

        // Fund cards
        funds.forEach(fund => {
            const card = document.createElement('div');
            card.className = 'account-card';
            card.innerHTML = `
                <div class="account-name">${escHtml(fund.name)} (Фонд)</div>
                <div class="account-balance">${fmt(fund.balance || 0)}</div>
            `;
            card.addEventListener('click', () => selectAccount(`fund-${fund.id}`, card));
            container.appendChild(card);
        });

        // Add account card
        const addCard = document.createElement('div');
        addCard.className = 'account-card account-card-add';
        addCard.innerHTML = `
            <div class="add-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </div>
            <span>Добавить счёт</span>
        `;
        addCard.addEventListener('click', () => window.location.href = 'accounts.html');
        container.appendChild(addCard);

        // Populate fund filter
        const fundFilter = document.getElementById('filter-fund');
        funds.forEach(f => {
            const opt = document.createElement('option');
            opt.value = f.id;
            opt.textContent = f.name;
            fundFilter.appendChild(opt);
        });

    } catch (err) {
        console.error('Error loading accounts:', err);
    }
}

function selectAccount(id, card) {
    selectedAccount = id;
    document.querySelectorAll('.account-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    loadTransactions();
}

// Load transactions
async function loadTransactions() {
    const tbody = document.getElementById('transactions-tbody');
    try {
        transactions = await apiFetch('/transactions');
        
        // Filter by account
        if (selectedAccount !== 'all') {
            if (selectedAccount.startsWith('fund-')) {
                const fundId = parseInt(selectedAccount.replace('fund-', ''));
                transactions = transactions.filter(t => t.fund_id === fundId);
            } else {
                const accId = selectedAccount;
                transactions = transactions.filter(t => t.account_id === accId);
            }
        }

        tbody.innerHTML = '';

        if (!transactions.length) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; padding: 40px; color: var(--text-secondary);">Операций не найдено</td></tr>`;
            document.getElementById('table-total').textContent = '0 ₽';
            return;
        }

        let total = 0;
        transactions.forEach((tx, i) => {
            const isIncome = tx.type === 'income';
            total += isIncome ? tx.amount : -tx.amount;
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="td-check"><input type="checkbox"></td>
                <td class="td-num">#${String(i + 1).padStart(5, '0')}</td>
                <td class="td-date">${fmtDate(tx.created_at)}</td>
                <td class="td-desc">${escHtml(tx.comment || 'Без описания')}</td>
                <td class="td-account">${tx.account_id ? 'Счёт' : '—'}</td>
                <td class="td-category"><span>Категория</span></td>
                <td><span class="${isIncome ? 'type-income' : 'type-expense'}">${isIncome ? 'Доход' : 'Расход'}</span></td>
                <td class="td-amount ${isIncome ? 'amount-income' : 'amount-expense'}">${isIncome ? '+' : '-'}${fmt(tx.amount)}</td>
                <td class="td-comment">${escHtml(tx.description || '—')}</td>
                <td class="td-actions">
                    <div class="action-btns">
                        <button class="action-btn" onclick="editTransaction(${tx.id})" aria-label="Редактировать">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                            </svg>
                        </button>
                        <button class="action-btn delete" onclick="deleteTransaction(${tx.id})" aria-label="Удалить">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"/>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                            </svg>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('table-total').textContent = `Итого: ${fmt(total)}`;

    } catch (err) {
        console.error('Error loading transactions:', err);
        tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; padding: 40px; color: var(--danger);">Ошибка загрузки</td></tr>`;
    }
}

// Modal handling
const modal = document.getElementById('transaction-modal');
let editingId = null;

function openModal(edit = false) {
    editingId = edit ? null : null;
    document.getElementById('modal-title').textContent = edit ? 'Редактировать операцию' : 'Добавить операцию';
    document.getElementById('tx-date').valueAsDate = new Date();
    document.getElementById('tx-amount').value = '';
    document.getElementById('tx-account').value = '';
    document.getElementById('tx-category').value = '';
    document.getElementById('tx-description').value = '';
    document.getElementById('tx-comment').value = '';
    modal.classList.add('open');
}

function closeModal() {
    modal.classList.remove('open');
    editingId = null;
}

document.getElementById('add-operation-btn').addEventListener('click', () => openModal(false));
document.getElementById('add-btn').addEventListener('click', () => openModal(false));
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
});

// Type segmented control
document.querySelectorAll('.type-segmented button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.type-segmented button').forEach(b => {
            b.classList.remove('active-income', 'active-expense');
        });
        btn.classList.add(btn.dataset.type === 'income' ? 'active-income' : 'active-expense');
    });
});

// Filter toggle
document.getElementById('toggle-filters-btn').addEventListener('click', () => {
    document.getElementById('extra-filters').classList.toggle('open');
});

// Quick dates
document.querySelectorAll('.quick-date-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.quick-date-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        const now = new Date();
        const from = document.getElementById('date-from');
        const to = document.getElementById('date-to');
        
        switch(btn.dataset.q) {
            case 'yesterday':
                const y = new Date(now);
                y.setDate(y.getDate() - 1);
                from.valueAsDate = y;
                to.valueAsDate = y;
                break;
            case 'today':
                from.valueAsDate = now;
                to.valueAsDate = now;
                break;
            case 'week':
                const weekStart = new Date(now);
                weekStart.setDate(weekStart.getDate() - 7);
                from.valueAsDate = weekStart;
                to.valueAsDate = now;
                break;
            case 'month':
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                from.valueAsDate = monthStart;
                to.valueAsDate = now;
                break;
        }
    });
});

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterType = btn.dataset.type;
        loadTransactions();
    });
});

// Init
document.addEventListener('DOMContentLoaded', () => {
    const today = new Date();
    document.getElementById('date-from').valueAsDate = new Date(today.getFullYear(), today.getMonth(), 1);
    document.getElementById('date-to').valueAsDate = today;
    
    loadAccounts();
    loadTransactions();
});

    if (confirm('Удалить эту операцию?')) {
        console.log('Delete transaction:', id);

}

// Select all checkbox
document.getElementById('select-all').addEventListener('change', (e) => {
    document.querySelectorAll('.td-check input[type="checkbox"]').forEach(cb => {
        cb.checked = e.target.checked;
    });
});
</script>
