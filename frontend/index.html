<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные финансы — Вход</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(26, 109, 255, 0.10);
            padding: 40px 36px 36px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #1a6dff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-icon svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #111;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: #f0f4ff;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .tab-btn.active {
            background: #fff;
            color: #1a6dff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.10);
        }

        /* Forms */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 9px;
            font-size: 15px;
            color: #111;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }

        .field input:focus {
            border-color: #1a6dff;
            box-shadow: 0 0 0 3px rgba(26, 109, 255, 0.12);
            background: #fff;
        }

        .field input.error {
            border-color: #ef4444;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: #1a6dff;
            color: #fff;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s, transform 0.1s;
            letter-spacing: 0.01em;
        }

        .btn-submit:hover {
            background: #1558d6;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background: #93b4ff;
            cursor: not-allowed;
            transform: none;
        }

        /* Alert */
        .alert {
            display: none;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .alert.error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .alert.success {
            display: block;
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        /* Spinner inside button */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Forgot password link */
        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 6px;
            font-size: 13px;
            color: #1a6dff;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .forgot-link:hover {
            color: #1558d6;
        }

        /* Modal overlay */
        /* Remember me */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1a6dff;
            cursor: pointer;
            flex-shrink: 0;
        }

        .remember-row label {
            font-size: 13px;
            color: #374151;
            cursor: pointer;
            user-select: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            padding: 32px 28px 28px;
            width: 100%;
            max-width: 360px;
            position: relative;
        }

        .modal h2 {
            font-size: 17px;
            font-weight: 700;
            color: #111;
            margin-bottom: 6px;
        }

        .modal p {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 20px;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 20px;
            color: #9ca3af;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px;
        }

        .modal-close:hover {
            color: #374151;
        }

        .modal-info {
            display: none;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            margin-top: 16px;
        }

        .modal-info.visible {
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        <h1>Личные финансы</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="login">Войти</button>
        <button class="tab-btn" data-tab="register">Регистрация</button>
    </div>

    <!-- Login -->
    <div class="form-panel active" id="panel-login">
        <div class="alert" id="login-alert"></div>
        <form id="login-form" novalidate>
            <div class="field">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="login-password">Пароль</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <div class="remember-row">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Запомнить меня</label>
            </div>
            <button type="button" class="forgot-link" id="forgot-link">Забыли пароль?</button>
            <button type="submit" class="btn-submit" id="login-btn">Войти</button>
        </form>
    </div>

    <!-- Register -->
    <div class="form-panel" id="panel-register">
        <div class="alert" id="register-alert"></div>
        <form id="register-form" novalidate>
            <div class="field">
                <label for="reg-name">Имя</label>
                <input type="text" id="reg-name" placeholder="Иван Иванов" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="reg-password">Пароль</label>
                <input type="password" id="reg-password" placeholder="Минимум 6 символов" autocomplete="new-password" required minlength="6">
            </div>
            <button type="submit" class="btn-submit" id="register-btn">Зарегистрироваться</button>
        </form>
    </div>
</div>

<!-- Forgot password modal -->
<div class="modal-overlay" id="forgot-modal">
    <div class="modal">
        <button class="modal-close" id="modal-close" aria-label="Закрыть">&times;</button>
        <h2>Восстановление пароля</h2>
        <p>Введите email, и мы пришлём инструкции по сбросу пароля.</p>
        <div class="field">
            <label for="forgot-email">Email</label>
            <input type="email" id="forgot-email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button class="btn-submit" id="forgot-submit">Отправить</button>
        <div class="modal-info" id="forgot-info">
            Функция восстановления пароля будет добавлена позже.
        </div>
    </div>
</div>

<script>
    const API = 'http://127.0.0.1:8000';

    // Redirect if already logged in (check both storages)
    if (localStorage.getItem('token') || sessionStorage.getItem('token')) {
        window.location.href = 'dashboard.html';
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
        });
    });

    function showAlert(id, message, type = 'error') {
        const el = document.getElementById(id);
        el.textContent = message;
        el.className = 'alert ' + type;
    }

    function setLoading(btn, loading) {
        if (loading) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>' + btn.dataset.label;
        } else {
            btn.disabled = false;
            btn.textContent = btn.dataset.label;
        }
    }

    // Forgot password modal
    const forgotModal = document.getElementById('forgot-modal');

    document.getElementById('forgot-link').addEventListener('click', () => {
        document.getElementById('forgot-email').value = '';
        document.getElementById('forgot-info').classList.remove('visible');
        forgotModal.classList.add('open');
        document.getElementById('forgot-email').focus();
    });

    document.getElementById('modal-close').addEventListener('click', () => {
        forgotModal.classList.remove('open');
    });

    forgotModal.addEventListener('click', (e) => {
        if (e.target === forgotModal) forgotModal.classList.remove('open');
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') forgotModal.classList.remove('open');
    });

    document.getElementById('forgot-submit').addEventListener('click', () => {
        document.getElementById('forgot-info').classList.add('visible');
    });

    // Store original labels
    document.getElementById('login-btn').dataset.label = 'Войти';
    document.getElementById('register-btn').dataset.label = 'Зарегистрироваться';

    // Login
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-btn');

        if (!email || !password) {
            showAlert('login-alert', 'Заполните все поля.');
            return;
        }

        setLoading(btn, true);

        try {
            const res = await fetch(`${API}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showAlert('login-alert', data.detail || 'Неверный email или пароль.');
            } else {
                const remember = document.getElementById('remember-me').checked;
                const storage = remember ? localStorage : sessionStorage;
                storage.setItem('token', data.access_token);
                window.location.href = 'dashboard.html';
            }
        } catch {
            showAlert('login-alert', 'Не удалось подключиться к серверу.');
        } finally {
            setLoading(btn, false);
        }
    });

    // Register
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const btn = document.getElementById('register-btn');

        if (!name || !email || !password) {
            showAlert('register-alert', 'Заполните все поля.');
            return;
        }
        if (password.length < 6) {
            showAlert('register-alert', 'Пароль должен содержать минимум 6 символов.');
            return;
        }

        setLoading(btn, true);

        try {
            const res = await fetch(`${API}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                showAlert('register-alert', data.detail || 'Ошибка регистрации.');
            } else {
                localStorage.setItem('token', data.access_token);
                window.location.href = 'dashboard.html';
            }
        } catch {
            showAlert('register-alert', 'Не удалось подключиться к серверу.');
        } finally {
            setLoading(btn, false);
        }
    });
</script>
</body>
</html>
